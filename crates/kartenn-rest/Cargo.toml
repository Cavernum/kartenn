[package]
name = "kartenn-rest"
version.workspace = true
description = "kartenn REST API: router, representations, problems"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[[test]]
name = "rest_it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
kartenn-auth = { version = "0.1.0", path = "../kartenn-auth" }
kartenn-core = { version = "0.1.0", path = "../kartenn-core" }
kartenn-service = { version = "0.1.0", path = "../kartenn-service" }
kartenn-store-pg = { version = "0.1.0", path = "../kartenn-store-pg" }
kartenn-telemetry = { version = "0.1.0", path = "../kartenn-telemetry" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid"] }
tokio = { version = "1.53.3", features = ["time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tower-http = { version = "0.7", features = ["catch-panic", "compression-br", "compression-gzip", "compression-zstd", "timeout"] }
http-body-util = "0.1.5"
thiserror = "2.0.21"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap"] }
form_urlencoded = "1.2.2"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
futures-util = { version = "0.3", default-features = false }
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid"] }
utoipa-axum = "0.3.0"
# The shell and its plugins (spec 007): snapshots, digests, decoded paths.
arc-swap = "1.9.3"
base64 = "0.22"
percent-encoding = "2.3.2"
semver = "1.0.28"

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.1.0", path = "../kartenn-testing" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
# Serving the router over a real port, in clear and in TLS (task 006-24).
kartenn-server = { version = "0.1.0", path = "../kartenn-server" }
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14.10"
