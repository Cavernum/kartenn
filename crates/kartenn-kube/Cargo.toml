[package]
name = "kartenn-kube"
version.workspace = true
description = "Kubernetes module of kartenn: object names and labels, selectors, owner chains, tracked fields"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[lints]
workspace = true

[features]
# The handler in the write pipeline and the storage in PostgreSQL (design 019, « Crates »);
# the port of reading of the 009 for the chain of execution, and the RBAC on the
# connection of a changeset for `kube.machine.looks_like_pod` (task 019-7b).
pg = ["dep:sqlx", "dep:serde", "dep:serde_json", "dep:time", "dep:kartenn-machines", "dep:kartenn-store-pg"]
# Its routes under `/v1`, mounted by kartenn-server (design 019, « Routes »).
rest = ["pg", "dep:axum", "dep:kartenn-rest", "dep:kartenn-store-pg", "dep:time", "dep:utoipa"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"], optional = true }
kartenn-core = { version = "0.1.0", path = "../kartenn-core" }
kartenn-machines = { version = "0.1.0", path = "../kartenn-machines", features = ["pg"], optional = true }
kartenn-rest = { version = "0.1.0", path = "../kartenn-rest", optional = true }
kartenn-service = { version = "0.1.0", path = "../kartenn-service" }
kartenn-store-pg = { version = "0.1.0", path = "../kartenn-store-pg", optional = true }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "json"], optional = true }
time = { version = "0.3.55", optional = true }
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid"], optional = true }
uuid = { version = "1.28.0", features = ["serde"] }

# One integration test binary for the crate (ADR 0027, point 2): `rest` implies `pg`.
[[test]]
name = "kube_it"
path = "tests/it/main.rs"
required-features = ["rest"]

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.1.0", path = "../kartenn-testing" }
# The edges of the module through the router (task 019-4d), as kartenn-machines tests it.
axum = { version = "0.8.9", default-features = false, features = ["json"] }
http-body-util = "0.1"
kartenn-auth = { path = "../kartenn-auth" }
kartenn-rest = { path = "../kartenn-rest" }
tower = { version = "0.5", features = ["util"] }
kartenn-machines = { path = "../kartenn-machines", features = ["pg"] }
kartenn-store-pg = { path = "../kartenn-store-pg" }
serde_json = { version = "1.0.154" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time", "json"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
