[package]
name = "kartenn-server"
version = "0.0.0"
description = "kartenn server binary: composition, configuration, observability"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
anyhow = "1.0.104"
figment = { version = "0.10.19", features = ["toml", "env"] }
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
kartenn-store-pg = { version = "0.0.0", path = "../kartenn-store-pg" }
kartenn-telemetry = { version = "0.0.0", path = "../kartenn-telemetry" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid"] }
syslog-sender = { version = "0.1.0", path = "../syslog-sender" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid"] }
