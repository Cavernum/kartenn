[package]
name = "kartenn-flow"
version.workspace = true
description = "Flow registry module of kartenn: requested flows, their triage, evaluation, waivers and derived state"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[lints]
workspace = true

[dependencies]
kartenn-core = { version = "0.1.0", path = "../kartenn-core" }
# The addresses of the endpoints and the values carried by machines (009 port of reading),
# and the policy evaluated in the transaction (spec 010).
kartenn-machines = { version = "0.1.0", path = "../kartenn-machines", features = ["pg"] }
kartenn-policy = { version = "0.1.0", path = "../kartenn-policy", features = ["pg"] }
kartenn-service = { version = "0.1.0", path = "../kartenn-service" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
# The operations of the module, decoded from their JSON body (ADR 0026, clause 6).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The handler in the write pipeline, in PostgreSQL (design 011 « Données »).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "json"] }
# Calendar months of the review and waiver ceilings (REQ-011-9, 22).
time = "0.3.55"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v7"] }

[[test]]
name = "flow_it"
path = "tests/it/main.rs"

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.1.0", path = "../kartenn-testing" }
kartenn-store-pg = { path = "../kartenn-store-pg" }
# The modules the flow registry depends on, for the tests through the write pipeline.
kartenn-machines = { path = "../kartenn-machines", features = ["pg"] }
kartenn-policy = { path = "../kartenn-policy", features = ["pg"] }
kartenn-vlan = { path = "../kartenn-vlan", features = ["pg"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time", "json"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
