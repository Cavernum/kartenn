[package]
name = "kartenn-service"
version.workspace = true
description = "Use cases and the changeset write pipeline of kartenn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[[test]]
name = "service_it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
kartenn-core = { version = "0.1.0", path = "../kartenn-core" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
tracing = "0.1.44"

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.1.0", path = "../kartenn-testing" }
jsonschema = { version = "0.59.0", default-features = false }
kartenn-store-pg = { path = "../kartenn-store-pg" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
