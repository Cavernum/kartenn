[package]
name = "kartenn-bench"
version = "0.0.0"
description = "Synthetic datasets and benchmarks for kartenn (performance budgets, D14)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
rand = "0.10.3"
rand_chacha = "0.10.0"
uuid = { version = "1.28.0", features = ["v7"] }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
kartenn-store-pg = { version = "0.0.0", path = "../kartenn-store-pg" }
kartenn-server = { version = "0.0.0", path = "../kartenn-server" }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "logs", "trace", "metrics"] }
serde_json = "1.0.154"
tonic = { version = "0.14.1", default-features = false, features = ["server", "router", "transport"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
