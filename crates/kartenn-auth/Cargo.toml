[package]
name = "kartenn-auth"
version = "0.0.0"
description = "Authentication adapters of kartenn (spec 005): key ring, session cookies, secrets, OIDC"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
uuid = { version = "1.28.0", features = ["v7"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "native-tokio", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio = { version = "1.53.3", features = ["time", "sync"] }
argon2 = "0.5"
sha1 = "0.10"

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server", "http1"] }
kartenn-store-pg = { path = "../kartenn-store-pg" }
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }
