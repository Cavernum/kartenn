[package]
name = "kartenn-auth"
version = "0.0.0"
description = "Authentication adapters of kartenn (spec 005): key ring, session cookies, secrets, OIDC"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
kartenn-store-pg = { path = "../kartenn-store-pg" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
