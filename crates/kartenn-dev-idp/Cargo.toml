[package]
name = "kartenn-dev-idp"
version.workspace = true
description = "OIDC issuer for development and end-to-end tests, never shipped (spec 007, REQ-007-35)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never shipped: no package, no registry (REQ-007-35).
publish = false

[lints]
workspace = true

[dependencies]
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2", "json", "query", "form"] }
base64 = "0.22"
form_urlencoded = "1.2.2"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "service", "tokio", "http1", "http2"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "0.8.23"
