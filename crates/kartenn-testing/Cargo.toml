[package]
name = "kartenn-testing"
version.workspace = true
description = "Test databases cloned from a migrated template (ADR 0028), development only"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary (ADR 0027).
autotests = false

[lints]
workspace = true

[[test]]
name = "testing_it"
path = "tests/it/main.rs"

[dependencies]
kartenn-testing-macros = { version = "0.1.0", path = "../kartenn-testing-macros" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
# `sqlx::migrate!` for the migrations of the tests.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
