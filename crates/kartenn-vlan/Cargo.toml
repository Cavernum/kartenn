[package]
name = "kartenn-vlan"
version = "0.0.0"
description = "VLAN module of kartenn: IEEE 802.1Q VLANs in VLAN groups"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[lints]
workspace = true

[features]
# The handler in the write pipeline and the storage in PostgreSQL (design 008, « Crates »).
pg = ["dep:sqlx", "dep:serde", "dep:serde_json", "dep:uuid"]
# Its routes under `/v1`, mounted by kartenn-server (design 008, « Lectures et routes »).
rest = ["pg", "dep:axum", "dep:kartenn-rest", "dep:kartenn-store-pg", "dep:time", "dep:utoipa", "dep:utoipa-axum"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"], optional = true }
kartenn-core = { path = "../kartenn-core" }
kartenn-rest = { version = "0.0.0", path = "../kartenn-rest", optional = true }
kartenn-store-pg = { version = "0.0.0", path = "../kartenn-store-pg", optional = true }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "time", "json"], optional = true }
time = { version = "0.3.55", optional = true }
unicode-normalization = "0.1.25"
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
uuid = { version = "1.28.0", features = ["v7", "serde"], optional = true }

# One integration test binary for the crate (ADR 0027, point 2): `rest` implies `pg`.
[[test]]
name = "vlan_it"
path = "tests/it/main.rs"
required-features = ["rest"]

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.0.0", path = "../kartenn-testing" }
http-body-util = "0.1"
kartenn-auth = { path = "../kartenn-auth" }
kartenn-store-pg = { path = "../kartenn-store-pg" }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time", "json"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
