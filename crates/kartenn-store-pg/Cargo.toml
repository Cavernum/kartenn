[package]
name = "kartenn-store-pg"
version = "0.0.0"
description = "PostgreSQL storage adapter of kartenn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[[test]]
name = "store_pg_it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
hmac = "0.13"
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-service = { version = "0.0.0", path = "../kartenn-service" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
# Test databases cloned from a migrated template (ADR 0028).
kartenn-testing = { version = "0.0.0", path = "../kartenn-testing" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
