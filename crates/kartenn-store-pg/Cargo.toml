[package]
name = "kartenn-store-pg"
version = "0.0.0"
description = "PostgreSQL storage adapter of kartenn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kartenn-core = { version = "0.0.0", path = "../kartenn-core" }
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
