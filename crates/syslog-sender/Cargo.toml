[package]
name = "syslog-sender"
version = "0.1.0"
description = "Syslog messages (RFC 5424, RFC 3164) with octet-counting framing over local sockets, UDP, TCP and TLS"
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-only like kartenn until a licence is chosen for its own publication (012/L24).
license.workspace = true
publish.workspace = true
keywords = ["syslog", "rfc5424", "rfc5425", "logging"]
categories = ["development-tools::debugging", "network-programming"]

[lints]
workspace = true

[features]
default = ["tokio", "tls"]
# Asynchronous transports (local sockets, UDP, TCP); formatting alone needs nothing.
tokio = ["dep:tokio"]
# TLS (RFC 5425) with rustls and the ring provider.
tls = ["tokio", "dep:tokio-rustls"]

[dependencies]
tokio = { version = "1.53.3", features = ["net", "io-util", "time"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14.5"
syslog_rfc5424 = "0.10.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
