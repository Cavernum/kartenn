[package]
name = "kartenn-core"
version = "0.0.0"
description = "Domain core of kartenn: address families, core objects, validation rules, properties"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[features]
# Fictitious 64-bit family (eight dotted octets, shaped like draft-thain-ipv8) used to
# prove that nothing outside the family implementations assumes 32 or 128 bits.
test-family = []
