[package]
name = "kartenn-core"
version.workspace = true
description = "Domain core of kartenn: address families, core objects, validation rules, properties"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary for the crate (ADR 0027): tests/it/main.rs.
autotests = false

[[test]]
name = "core_it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "pkcs8", "pem"] }
idna = "1.1.0"
kartenn-workspace-hack = { version = "0.1", path = "../kartenn-workspace-hack" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
proptest = "1.12.0"

[features]
# Fictitious 64-bit family (eight dotted octets, shaped like draft-thain-ipv8) used to
# prove that nothing outside the family implementations assumes 32 or 128 bits.
test-family = []
