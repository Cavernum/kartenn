# The second server of the end-to-end sessions of the Python CLI (spec 023, task 26,
# maquette § 12): a build without the `policy` and `flow` modules, on 9445. Started by
# `web/e2e/serve.sh cli-labo` on the kartenn_cli_labo database; paths are relative to the
# repository.
[telemetry]
outputs = [{ kind = "stdout", filter = "warn" }]

# A server without the event stream (spec 022), for the scene « watch » without it.
[events]
enabled = false

[http]
listen = "127.0.0.1:9445"
public_origin = "https://127.0.0.1:9445"

[http.tls]
cert_file = "web/e2e/.state/cert.pem"
key_file = "web/e2e/.state/key.pem"

[auth]
key_file = "web/e2e/.state/kartenn-keys"
redirect_uri = "https://127.0.0.1:9445/v1/auth/callback"

[[auth.issuers]]
id = "dev"
issuer = "https://127.0.0.1:9444"
client_id = "kartenn"
client_secret_file = "web/e2e/.state/idp-secret"
audience = "kartenn"
algorithms = ["ES256"]
native_client_id = "kartenn-cli"
native_scopes = ["openid", "offline_access"]
native_device = true
