# Continuous integration (ADR 0033): the same checks as locally, through the scripts of the
# repository (scripts/ci.sh, scripts/ci-lint.sh) and the flake. Also called by
# release.yml on the tagged commit before anything is published.
#
# Nix: the binary caches of nixpkgs and of devenv-nixpkgs (the nixpkgs of devenv.yaml and
# of the flake), read only and checked by their public keys: no cache account, no secret.
# No GitHub token in nix.conf either: these jobs run the code of pull requests.
#
# The scripts of the repository are POSIX sh for the dash of Nix (`#!/usr/bin/env dash`,
# `set -o pipefail`, dash >= 0.5.13): they run under `nix shell … nixpkgs#dash`, never under
# the dash of the runner, which lacks pipefail. The `run:` steps stay in GitHub's bash
# (`-eo pipefail`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Every job states its own permissions.
permissions: {}

concurrency:
  # A new push to a pull request cancels its previous run. main keeps one result per
  # commit: k-release requires a green run on the very commit it releases.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Workflows et scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: actionlint, zizmor, shellcheck
        run: |
          nix shell --inputs-from . nixpkgs#dash nixpkgs#actionlint nixpkgs#zizmor nixpkgs#shellcheck \
            --command scripts/ci-lint.sh

  devenv:
    name: Rust, web, Python et parcours de bout en bout
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read # checkout
    steps:
      - name: Disk space for the toolchains and the builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
          # Logs of scripts/ci.sh, k-check, k-web-check, k-py-check and k-web-e2e, kept on failure.
          mkdir -p "$RUNNER_TEMP/kartenn"
          echo "TMPDIR=$RUNNER_TEMP/kartenn" >>"$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: devenv, from the nixpkgs of the flake
        run: |
          nix build --inputs-from . nixpkgs#devenv --out-link "$RUNNER_TEMP/devenv"
          echo "$RUNNER_TEMP/devenv/bin" >>"$GITHUB_PATH"
      # sccache (RUSTC_WRAPPER of devenv.nix): compiled dependencies, keyed on the locks.
      # Never restored for a tag: a release is checked from a clean state.
      - name: Cache sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'devenv.lock') }}
      - name: PostgreSQL 18
        run: |
          devenv up --detach postgres
          for _ in $(seq 1 90); do
            devenv shell -- pg_isready -q -h 127.0.0.1 && exit 0
            sleep 2
          done
          echo "PostgreSQL ne répond pas" >&2
          exit 1
      - name: scripts/ci.sh --no-nix
        run: nix shell --inputs-from . nixpkgs#dash --command scripts/ci.sh --no-nix
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kartenn
          retention-days: 7
          if-no-files-found: ignore

  nix:
    name: Flake (paquets, image OCI, test NixOS)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read # checkout
    steps:
      - name: Disk space, and KVM for the NixOS test
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            system-features = nixos-test benchmark big-parallel kvm
      - name: nix flake check
        run: nix flake check --keep-going
      - name: nix build .#kartenn .#oci
        run: nix build --no-link .#kartenn .#oci
