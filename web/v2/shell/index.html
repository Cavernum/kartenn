<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kartenn</title>
    <!-- The critical sheet (public/boot.css, copied as is): the skeleton of the frame below
         (spec 021, REQ-021-1), and the order of the layers, fixed by the first sheet of the
         page whatever sheets the build links after it. -->
    <link rel="stylesheet" href="/boot.css" />
    <!-- What the frame keeps (sidebar, panel, dates, theme), read before the first paint. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <!-- The static skeleton of the frame, in its geometry, replaced by the application
         once its first page is ready (src/main.ts). -->
    <div id="app">
      <p id="k-boot-status" class="k-visually-hidden" role="status">Chargement de kartenn…</p>
      <noscript><p class="k-boot__noscript">kartenn demande JavaScript.</p></noscript>
      <div class="k-boot" aria-hidden="true">
        <div class="k-boot__sidebar"></div>
        <div class="k-boot__column">
          <div>
            <div class="k-boot__bar"></div>
            <div class="k-boot__band"></div>
          </div>
          <div class="k-boot__body">
            <div class="k-boot__surface">
              <div class="k-boot__panel k-skeleton-fill"></div>
              <div class="k-boot__panel k-skeleton-fill"></div>
            </div>
            <div class="k-boot__rail"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
