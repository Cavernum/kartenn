      - 'grid "Extrait de la matrice Applicatif : source en ligne, destination en colonne"':
        - rowgroup:
          - row "Source → destination Production Recette Développement":
            - columnheader "Source → destination"
            - columnheader "Production"
            - columnheader "Recette"
            - columnheader "Développement"
