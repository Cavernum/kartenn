- main:
  - heading "Matrice de politique applicatif" [level=1]
  - region "Matrice":
    - heading "Matrice" [level=2]
    - text: Applicatif Type de flux
    - combobox "Type de flux": Applicatif
    - toolbar "Actions de la matrice":
      - button "3 règles hors vue"
      - button "Simuler le brouillon"
      - button "Plus d'actions"
    - 'grid "Matrice Applicatif : source en ligne, destination en colonne"':
      - rowgroup:
        - row "Source → destination Production Préproduction Recette Intégration Développement":
          - columnheader "Source → destination"
          - columnheader "Production"
          - columnheader "Préproduction"
          - columnheader "Recette"
          - columnheader "Intégration"
          - columnheader "Développement"
      - rowgroup:
        - row "Production Autoriser Interdire Interdire Interdire Interdire":
          - rowheader "Production"
          - gridcell "Autoriser"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Interdire"
        - row "Préproduction Sous motif (en revue) Autoriser Refus par défaut Interdire Interdire":
          - rowheader "Préproduction"
          - gridcell "Sous motif (en revue)"
          - gridcell "Autoriser"
          - gridcell "Refus par défaut"
          - gridcell "Interdire"
          - gridcell "Interdire"
        - row "Recette Sous motif (en brouillon) Refus par défaut Autoriser Autoriser Refus par défaut":
          - rowheader "Recette"
          - gridcell "Sous motif (en brouillon)"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
          - gridcell "Refus par défaut"
        - row "Intégration Interdire Refus par défaut Autoriser Autoriser Autoriser":
          - rowheader "Intégration"
          - gridcell "Interdire"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
        - row "Développement Interdire Interdire Refus par défaut Autoriser Autoriser":
          - rowheader "Développement"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
    - list "Légende de la matrice":
      - listitem: dans le brouillon
      - listitem: en revue
      - listitem: cellule choisie
    - text: /Brouillon · 1 cellule de cette matrice sur 2 · 1 en revue 1 s'ouvre sous réserve · \d+ non conformes à cette matrice · 0 conforme de nouveau/
- complementary "Panneau droit":
  - separator "Redimensionner le panneau"
  - tablist "Onglets du panneau":
    - tab "Détail"
    - tab "Brouillon 3" [selected]
  - tabpanel "Brouillon 3":
    - region "Cellules changées":
      - heading "Cellules changées" [level=2]
      - text: 2 cellules
      - list:
        - listitem:
          - text: De Recette vers Production
          - button "Retirer la cellule Recette → Production de la matrice Applicatif"
          - term: Type de flux
          - definition: Applicatif
          - term: État
          - definition:
            - deletion: "avant : Refus par défaut"
            - insertion: "après : Sous motif"
          - term: Motif
          - definition:
            - insertion:
              - text: "ajouté :"
              - button "Copier api-lecture":
                - text: ""
                - code: api-lecture
              - status
          - term: Libellé
          - definition:
            - insertion: "ajouté : Lecture des API de production depuis la recette"
        - listitem:
          - text: De Intégration vers Préproduction
          - button "Retirer la cellule Intégration → Préproduction de la matrice Administratif"
          - term: Type de flux
          - definition: Administratif
          - term: État
          - definition:
            - deletion: "avant : Autoriser"
            - insertion: "après : Sous motif"
          - term: Motif
          - definition:
            - insertion:
              - text: "ajouté :"
              - button "Copier bastion-admin":
                - text: ""
                - code: bastion-admin
              - status
          - term: Libellé
          - definition:
            - insertion: "ajouté : Administration de la préproduction par le bastion"
    - region "Effet simulé":
      - heading "Effet simulé" [level=2]
      - term: S'ouvrent sous réserve
      - definition: "2"
      - term: Non conformes
      - definition: /\d+/
      - term: Conformes de nouveau
      - definition: "0"
      - status:
        - paragraph: "/Avertissement : \\d+ flux deviennent non conformes à la matrice de leur type/"
        - text: Ils étaient conformes avant ce brouillon. Seuls les types de flux dont il change la matrice sont touchés ; la règle qui refuse chaque flux est dans sa liste.
      - region "Applicatif":
        - heading "Applicatif" [level=3]
        - text: /\d+ non conformes 5 sur \d+ lignes/
        - 'button "Agrandir : Flux de type Applicatif non conformes à leur matrice après ce brouillon"'
        - grid "Flux de type Applicatif non conformes à leur matrice après ce brouillon":
          - rowgroup:
            - row "Source Destination":
              - columnheader "Source"
              - columnheader "Destination"
          - rowgroup:
            - row "rece-batch prod-api":
              - gridcell "rece-batch"
              - gridcell "prod-api"
            - row "rece-batch prod-registry":
              - gridcell "rece-batch"
              - gridcell "prod-registry"
            - row "rece-ci prod-api":
              - gridcell "rece-ci"
              - gridcell "prod-api"
            - row "rece-ci prod-registry":
              - gridcell "rece-ci"
              - gridcell "prod-registry"
            - row "rece-etl prod-api":
              - gridcell "rece-etl"
              - gridcell "prod-api"
            - row "rece-etl prod-registry":
              - gridcell "rece-etl"
              - gridcell "prod-registry"
            - row "rece-mon prod-api":
              - gridcell "rece-mon"
              - gridcell "prod-api"
            - row "rece-mon prod-registry":
              - gridcell "rece-mon"
              - gridcell "prod-registry"
            - row "rece-web prod-api":
              - gridcell "rece-web"
              - gridcell "prod-api"
            - row "rece-web prod-registry":
              - gridcell "rece-web"
              - gridcell "prod-registry"
      - region "Administratif":
        - heading "Administratif" [level=3]
        - text: 6 non conformes 5 sur 6 lignes
        - 'button "Agrandir : Flux de type Administratif non conformes à leur matrice après ce brouillon"'
        - grid "Flux de type Administratif non conformes à leur matrice après ce brouillon":
          - rowgroup:
            - row "Source Destination":
              - columnheader "Source"
              - columnheader "Destination"
          - rowgroup:
            - row "inte-ci preprod-app":
              - gridcell "inte-ci"
              - gridcell "preprod-app"
            - row "inte-ci preprod-db":
              - gridcell "inte-ci"
              - gridcell "preprod-db"
            - row "inte-mon preprod-app":
              - gridcell "inte-mon"
              - gridcell "preprod-app"
            - row "inte-mon preprod-db":
              - gridcell "inte-mon"
              - gridcell "preprod-db"
            - row "inte-web preprod-app":
              - gridcell "inte-web"
              - gridcell "preprod-app"
            - row "inte-web preprod-db":
              - gridcell "inte-web"
              - gridcell "preprod-db"
    - region "Autres opérations":
      - heading "Autres opérations" [level=2]
      - text: "1"
      - list "Opérations du brouillon":
        - listitem:
          - code: /\d+\.\d+\.\d+\.\d+/
          - text: "Usage :"
          - deletion: "avant : Hôte"
          - insertion: "après : VIP"
          - button /Retirer l'opération « Usage » sur \d+\.\d+\.\d+\.\d+/
  - button "Largeur du panneau"
  - button "Fermer le panneau"
  - status: Revue requise Simulation valide ; politique « Changements de matrice ».
  - text: Résumé (obligatoire)
  - textbox "Résumé (obligatoire)": Accès sous motif, matrices applicatif et administratif
