- main:
  - heading /Préfixe \d+\.\d+\.\d+\.\d+\/\d+/ [level=1]
  - region /\d+\.\d+\.\d+\.\d+\/\d+/:
    - heading /\d+\.\d+\.\d+\.\d+\/\d+/ [level=2]
    - text: préfixe · réseau · Supervision
    - button "Modifier"
    - button "Actions"
    - tablist "Sections de la fiche":
      - tab "Propriétés 5"
      - tab "Historique 3"
      - tab "Flux 3" [selected]
    - tabpanel "Flux 3":
      - button "Colonnes"
      - grid /Flux de \d+\.\d+\.\d+\.\d+\/\d+/:
        - rowgroup:
          - row "Sens Flux Autre extrémité État Par":
            - columnheader "Sens"
            - columnheader "Flux"
            - columnheader "Autre extrémité"
            - columnheader "État"
            - columnheader "Par"
        - rowgroup:
          - row /Entrant flux-\d+ srv-app-\d+ · eth0 Non conforme le préfixe lui-même/:
            - gridcell "Entrant"
            - gridcell /flux-\d+/:
              - link /flux-\d+/:
                - /url: /_ui/ecrans/E22?vue=fiche&mode=light
            - gridcell /srv-app-\d+ · eth0/
            - gridcell "Non conforme"
            - gridcell "le préfixe lui-même"
          - row /Entrant flux-\d+ bastion-\d+ · eth0 Actif \d+\.\d+\.\d+\.\d+, qu'il contient/:
            - gridcell "Entrant"
            - gridcell /flux-\d+/:
              - link /flux-\d+/:
                - /url: /_ui/ecrans/E22?vue=fiche&mode=light
            - gridcell /bastion-\d+ · eth0/
            - gridcell "Actif"
            - gridcell /\d+\.\d+\.\d+\.\d+, qu'il contient/
          - row /Entrant changeset srv-web-\d+ · eth0 Demandé \d+\.\d+\.\d+\.\d+, qu'il contient/:
            - gridcell "Entrant"
            - gridcell "changeset":
              - link "changeset":
                - /url: /changesets/01JF3C1E3G5J7L9N1Q3S5U7W9Y
            - gridcell /srv-web-\d+ · eth0/
            - gridcell "Demandé"
            - gridcell /\d+\.\d+\.\d+\.\d+, qu'il contient/
      - paragraph:
        - text: "Une demande en attente n'a pas encore de fiche : son changeset la montre."
        - link "Tous ses flux dans le registre":
          - /url: /_ui/ecrans/E11?vue=registre&mode=light
        - text: .
    - heading "Attributs" [level=2]
    - term: Domaine
    - definition: Centre de données nord
    - term: Environnement
    - definition:
      - button "Production"
      - status
    - term: Propriétaire
    - definition: Atelier Nord
- button "Ouvrir le panneau"
- alert
- status