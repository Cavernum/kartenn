  - button "Présent"
  - button "Brouillon 0 opération" [expanded]
  - button "Liste des brouillons"
  - button "Compte de Camille Martin"
- main:
  - heading "Inférence" [level=1]
  - region "Règles d'inférence":
    - heading "Règles d'inférence" [level=2]
    - text: jeu r17 · axe Environnement Axe visé
    - combobox "Axe visé": Environnement
    - toolbar "Actions des règles d'inférence":
      - button "Créer une règle"
      - button "Écarts ouverts (5)"
      - button "Plus d'actions"
    - button "Colonnes"
    - grid "Règles d'inférence de l'axe Environnement":
      - rowgroup:
        - row "Priorité Règle Attendu Critères":
          - columnheader "Priorité"
          - columnheader "Règle"
          - columnheader "Attendu"
          - columnheader "Critères"
      - rowgroup:
        - row /\d+ env-par-site Production site = site-ouest · famille IPv4 ou IPv6/ [selected]:
          - gridcell /\d+/
          - gridcell "env-par-site"
          - gridcell "Production"
          - gridcell "site = site-ouest · famille IPv4 ou IPv6"
        - row /\d+ env-par-vlan Recette core\.vlan = \d+–\d+/:
          - gridcell /\d+/
          - gridcell "env-par-vlan"
          - gridcell "Recette"
          - gridcell /core\.vlan = \d+–\d+/
        - row /\d+ env-par-nom Développement nom ~ \^dev-/:
          - gridcell /\d+/
          - gridcell "env-par-nom"
          - gridcell "Développement"
          - gridcell "nom ~ ^dev-"
        - row /\d+ admin-par-prefixe Administration préfixe ⊂ \d+\.\d+\.\d+\.\d+\/\d+/:
          - gridcell /\d+/
          - gridcell "admin-par-prefixe"
          - gridcell "Administration"
          - gridcell /préfixe ⊂ \d+\.\d+\.\d+\.\d+\/\d+/
    - text: "/4 règles · révision du jeu r17, \\d+-\\d+-\\d+ À priorité égale, deux attendus différents : aucun n'est retenu/"
- complementary "Panneau droit":
  - separator "Redimensionner le panneau"
  - tablist "Onglets du panneau":
    - tab "Détail" [selected]
    - tab "Brouillon 0"
  - tabpanel "Détail":
    - heading "env-par-site" [level=2]:
      - code: env-par-site
    - term: Axe visé
    - definition: Environnement
    - term: Clé de l'axe
    - definition: policy.environment
    - term: Attendu
    - definition: Production
    - term: Priorité
    - definition: /\d+/
    - term: Domaine
    - definition: Centre de données nord
    - term: Révision du jeu
    - definition: /r17 \(\d+-\d+-\d+\)/
    - region "Critères":
      - heading "Critères" [level=3]
      - list:
        - listitem:
          - code: site = site-ouest
        - listitem:
          - code: famille IPv4 ou IPv6
    - region "Exceptions":
      - heading "Exceptions" [level=3]
      - list "Exceptions de env-par-site":
        - listitem:
          - text: "1"
          - code: /préfixe ⊂ \d+\.\d+\.\d+\.\d+\/\d+ \(salle B\)/
          - text: Recette
        - listitem:
          - text: "2"
          - code: nom ~ ^srv-prod-
          - text: Production
    - paragraph: "/Version v3, du \\d+-\\d+-\\d+, par Sacha Morel : « Salle B en recette »\\./"
  - button "Largeur du panneau"
  - button "Fermer le panneau"
  - button "Clore…"
  - button "Modifier"