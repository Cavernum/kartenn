            - text: ""
            - code: secours
          - gridcell "oui"
          - gridcell "1"
          - gridcell "1"
          - gridcell "Compte de secours, administrateur global"
        - row "(en brouillon) Équipe supervision supervision non 5 3 Lecture du réseau, instruction" [selected]:
