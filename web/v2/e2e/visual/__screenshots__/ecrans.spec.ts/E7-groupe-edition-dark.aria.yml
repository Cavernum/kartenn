          - gridcell "Équipe réseau reseau":
            - text: ""
            - code: reseau
          - gridcell "non"
          - gridcell /\d+/
          - gridcell "2"
          - gridcell "Édition du réseau de l'atelier nord"
        - row "Astreinte astreinte non 3 1 Lecture de tout le référentiel":
