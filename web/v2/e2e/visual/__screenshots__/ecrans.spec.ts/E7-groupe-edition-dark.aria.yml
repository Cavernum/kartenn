        - listitem:
          - text: idp-interne / supervision-n1 groupe de l'IdP
          - button "Retirer idp-interne / supervision-n1 du groupe"
        - listitem:
          - text: Alex Morel personne
          - button "Retirer Alex Morel du groupe"
        - listitem:
          - text: Lou Bernard personne
          - button "Retirer Lou Bernard du groupe"
        - listitem:
          - img "Retrait en brouillon"
          - text: Sam Leroy personne jusqu'au
          - time: /\d+-\d+-\d+/
          - button "Annuler le retrait de Sam Leroy"
        - listitem:
          - text: export-dns compte de service
          - button "Retirer export-dns du groupe"
        - listitem:
          - img "Ajout en brouillon"
          - text: idp-interne / supervision-n2 groupe de l'IdP
          - button "Retirer l'ajout de idp-interne / supervision-n2 du brouillon"
      - button "Ajouter un membre"
