      - 'heading "Rôles sur périmètres · 3 (brouillon : −1, +1)" [level=3]'
      - list:
        - listitem:
          - text: Lecteur réseau
          - code: lecteur-reseau
          - text: "Entité : Atelier Nord"
          - 'button "Modifier le rôle lecteur-reseau · Entité : Atelier Nord"'
          - 'button "Retirer le rôle lecteur-reseau · Entité : Atelier Nord"'
        - listitem:
          - text: Instructeur
          - code: instructeur-flux
          - text: "Site : site-ouest"
          - 'button "Modifier le rôle instructeur-flux · Site : site-ouest"'
          - 'button "Retirer le rôle instructeur-flux · Site : site-ouest"'
        - listitem:
          - img "Retrait en brouillon"
          - text: Lecteur
          - code: reader
          - text: "Domaine : dc-nord jusqu'au"
          - time: /\d+-\d+-\d+/
          - 'button "Annuler le retrait du rôle reader · Domaine : dc-nord"'
        - listitem:
          - img "Ajout en brouillon"
          - text: Éditeur
          - code: editor
          - text: "Site : site-ouest"
          - 'button "Retirer l''ajout du rôle editor · Site : site-ouest du brouillon"'
      - button "Ajouter un rôle"
  - button "Fermer le panneau"