            - code: astreinte
          - gridcell "non"
          - gridcell "3"
          - gridcell "1"
          - gridcell "Lecture de tout le référentiel"
        - row "Équipe sauvegarde sauvegarde non 4 1 Lecture des machines du domaine":
          - gridcell "Équipe sauvegarde sauvegarde":
            - text: ""
            - code: sauvegarde
          - gridcell "non"
          - gridcell "4"
          - gridcell "1"
          - gridcell "Lecture des machines du domaine"
        - row "compte-sync-ipam non 1 1 Reporté par la migration, à regrouper":
          - gridcell "compte-sync-ipam":
            - code: compte-sync-ipam
          - gridcell "non"
          - gridcell "1"
          - gridcell "1"
          - gridcell "Reporté par la migration, à regrouper"
- complementary "Panneau droit":
  - separator "Redimensionner le panneau"
  - tablist "Onglets du panneau":
    - tab "Détail" [selected]
    - tab "Brouillon 4"
  - tabpanel "Détail":
    - heading "Équipe supervision supervision" [level=2]
    - toolbar "Actions du groupe":
      - button "Modifier"
      - button "Clore…"
    - 'region "Membres · 5 (brouillon : −1, +1)"':
      - 'heading "Membres · 5 (brouillon : −1, +1)" [level=3]'
