          - 'row /exposition-internet zone zone = internet avant : \d+ après : \d+ \(en brouillon\)/':
            - gridcell "exposition-internet"
            - gridcell "zone"
            - gridcell "zone = internet"
            - 'gridcell /avant : \d+ après : \d+ \(en brouillon\)/':
              - deletion: "/avant : \\d+/"
              - insertion: "/après : \\d+/"
              - text: ""
          - row /donnees-restreintes axis_value sensitivity = restreint \d+/:
            - gridcell "donnees-restreintes"
            - gridcell "axis_value"
            - gridcell "sensitivity = restreint"
            - gridcell /\d+/
          - row /ports-hauts port_range tcp \d+–\d+ \d+/:
            - gridcell "ports-hauts"
            - gridcell "port_range"
            - gridcell /tcp \d+–\d+/
            - gridcell /\d+/
