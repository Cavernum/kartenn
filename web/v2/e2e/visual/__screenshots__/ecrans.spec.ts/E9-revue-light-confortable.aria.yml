- main:
  - heading "Adresses" [level=1]
  - region /Adresses 1 \d+/:
    - heading /Adresses 1 \d+/ [level=2]
    - paragraph:
      - text: "À venir :"
      - code: Toast
      - text: /\(tâche \d+\)/
    - status:
      - paragraph: "/Proposé, en revue : votre modification de \\d+\\.\\d+\\.\\d+\\.\\d+ attend une validation\\./"
      - text: Changeset
      - button "Copier 01JD4K8B2C3D4E5F6G7H8J9K0M":
        - text: ""
        - code: 01JD4K8B2C3D4E5F6G7H8J9K0M
      - status
      - text: ; la cellule garde la valeur lue d'ici là.
      - list:
        - listitem:
          - text: Vous n'avez pas le droit d'appliquer vous-même les adresses (core.address.apply_own).
          - button "Copier changeset.apply_own.missing":
            - text: ""
            - code: changeset.apply_own.missing
          - status
    - grid "Adresses":
      - rowgroup:
        - row "Valeur Usage Propriétaire Site":
          - columnheader "Valeur"
          - columnheader "Usage"
          - columnheader "Propriétaire"
          - columnheader "Site"
      - rowgroup:
        - row /\d+\.\d+\.\d+\.\d+ Hôte Atelier Nord site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Atelier Nord"
          - gridcell "site-ouest"
        - row /\d+\.\d+\.\d+\.\d+ VIP Atelier Nord site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "VIP"
          - gridcell "Atelier Nord"
          - gridcell "site-ouest"
        - row /\(en revue\) \d+\.\d+\.\d+\.\d+ Hôte Service Pilote \(en revue\) site-ouest/:
          - gridcell /\(en revue\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Service Pilote (en revue)"
          - gridcell "site-ouest"
        - row /\d+\.\d+\.\d+\.\d+ Hôte Service Pilote site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Service Pilote"
          - gridcell "site-ouest"