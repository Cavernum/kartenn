  - navigation "Cas de la maquette":
    - text: ""
    - link "Ouvert et conforme":
      - /url: /_ui/ecrans/E11?vue=tester&mode=light
    - link "Ouvert mais non conforme":
      - /url: /_ui/ecrans/E11?vue=tester-derogation&mode=light
