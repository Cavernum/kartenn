- main:
  - figure
- dialog "Raccourcis clavier":
  - banner:
    - heading "Raccourcis clavier" [level=2]
    - button "Fermer"
  - paragraph: Les raccourcis à une touche sont actifs ; le menu du compte les désactive. Ctrl+K, Ctrl+Entrée et Échap restent.
  - grid "Raccourcis clavier":
    - rowgroup:
      - row "Touches Action Portée":
        - columnheader "Touches"
        - columnheader "Action"
        - columnheader "Portée"
