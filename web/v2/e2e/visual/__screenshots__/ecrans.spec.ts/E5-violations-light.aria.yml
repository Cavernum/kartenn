- main:
  - heading "Adresses" [level=1]
  - region "Adresses":
    - heading "Adresses" [level=2]
    - text: /1 \d+/
    - toolbar "Actions sur les adresses":
      - button "Créer"
      - button "Importer"
      - button "Copier les valeurs"
    - button "Colonnes"
    - grid "Adresses":
      - rowgroup:
        - row "Valeur Propriétaire":
          - columnheader "Valeur"
          - columnheader "Propriétaire":
            - text: ""
            - 'button "Filtrer : Propriétaire"'
      - rowgroup:
        - row /\d+\.\d+\.\d+\.\d+ Atelier Nord/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Atelier Nord"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ Atelier Nord/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Atelier Nord"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ Atelier Sud/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Atelier Sud"
        - row /\d+\.\d+\.\d+\.\d+ Service Pilote/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Service Pilote"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ Service Pilote/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Service Pilote"
        - row /\d+\.\d+\.\d+\.\d+ Service Pilote/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Service Pilote"
- complementary "Panneau droit":
  - separator "Redimensionner le panneau"
  - tablist "Onglets du panneau":
    - tab "Détail"
    - tab "Brouillon 3" [selected]
  - tabpanel "Brouillon 3":
    - list "Opérations du brouillon":
      - listitem:
        - code: /\d+\.\d+\.\d+\.\d+/
        - text: "Usage :"
        - deletion: "avant : Hôte"
        - insertion: "après : VIP"
        - button /Retirer l'opération « Usage » sur \d+\.\d+\.\d+\.\d+/
      - listitem:
        - code: /\d+\.\d+\.\d+\.\d+/
        - text: "Propriétaire :"
        - deletion: "avant : Atelier Nord"
        - insertion: "après : Atelier Sud"
        - button /Retirer l'opération « Propriétaire » sur \d+\.\d+\.\d+\.\d+/
        - alert:
          - paragraph: "/\\d+\\.\\d+\\.\\d+\\.\\d+ : refusée par la simulation/"
          - list:
            - listitem:
              - text: « Atelier Sud » n'est pas une entité connue.
              - button "Copier prop.assignment.invalid_value":
                - text: ""
                - code: prop.assignment.invalid_value
              - status
      - listitem:
        - code: /\d+\.\d+\.\d+\.\d+/
        - text: "Créer l'adresse :"
        - insertion: "ajouté : Hôte, Service Pilote"
        - button /Retirer l'opération « Créer l'adresse » sur \d+\.\d+\.\d+\.\d+/
        - alert:
          - paragraph: "/\\d+\\.\\d+\\.\\d+\\.\\d+ : refusée par la simulation/"
          - list:
            - listitem:
              - text: /L'adresse sort du réseau \d+\.\d+\.2\.0\/\d+ qui devait la contenir\./
              - button "Copier core.address.outside_network":
                - text: ""
                - code: core.address.outside_network
              - status
  - button "Largeur du panneau"
  - button "Fermer le panneau"
  - status: 2 violations Corriger ou retirer les opérations en cause pour appliquer ou soumettre ; le brouillon s'enregistre tel quel, violations comprises.
  - text: Résumé (obligatoire)
  - textbox "Résumé (obligatoire)": Maintenance du référentiel
  - button "Ajouter une description"
  - button "Enregistrer le brouillon"
  - button "Choisir l'action"