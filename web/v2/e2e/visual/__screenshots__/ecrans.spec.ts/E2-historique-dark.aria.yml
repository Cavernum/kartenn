- main:
  - heading /Préfixe \d+\.\d+\.\d+\.\d+\/\d+/ [level=1]
  - region /\d+\.\d+\.\d+\.\d+\/\d+/:
    - heading /\d+\.\d+\.\d+\.\d+\/\d+/ [level=2]
    - text: préfixe · réseau · Supervision
    - button "Modifier"
    - button "Actions"
    - tablist "Sections de la fiche":
      - tab "Propriétés"
      - tab "Contenu"
      - tab "Historique" [selected]
      - tab "Anomalies"
      - tab "VLAN"
      - tab "Machines"
      - tab "Flux (en chargement)"
    - tabpanel "Historique":
      - button "Colonnes"
      - grid /Versions de \d+\.\d+\.\d+\.\d+\/\d+/:
        - rowgroup:
          - row "Version Valide Motif Auteur":
            - columnheader "Version"
            - columnheader "Valide"
            - columnheader "Motif":
              - text: ""
              - 'button "Filtrer : Motif"'
            - columnheader "Auteur"
        - rowgroup:
          - row /v4 \d+-\d+-\d+ → Bascule des VIP salle B Camille Martin/:
            - gridcell "v4"
            - gridcell /\d+-\d+-\d+ →/
            - gridcell "Bascule des VIP salle B":
              - link "Bascule des VIP salle B":
                - /url: /changesets/01JD4K8B2C
            - gridcell "Camille Martin"
          - row /v3 \d+-\d+-\d+ → \d+-\d+-\d+ Rattachement au site ouest Lou Bernard/:
            - gridcell "v3"
            - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
            - gridcell "Rattachement au site ouest":
              - link "Rattachement au site ouest":
                - /url: /changesets/01JC9Q2H7R
            - gridcell "Lou Bernard"
          - 'row /v2 \d+-\d+-\d+ → \d+-\d+-\d+ Correction rétroactive du propriétaire personne #7d3a/':
            - gridcell "v2"
            - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
            - gridcell "Correction rétroactive du propriétaire":
              - link "Correction rétroactive du propriétaire":
                - /url: /changesets/01JB1T5W3E
            - 'gridcell "personne #7d3a"'
          - row /v1 \d+-\d+-\d+ → \d+-\d+-\d+ Import initial import-ipam/:
            - gridcell "v1"
            - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
            - gridcell "Import initial":
              - link "Import initial":
                - /url: /changesets/01JA0N8D4F
            - gridcell "import-ipam"
      - alert
