- main:
  - 'heading /Topographie : \d+\.\d+\.\d+\.\d+\/\d+/ [level=1]'
  - heading "Préfixes Centre de données nord" [level=2]
  - treegrid "Arbre des préfixes du domaine Centre de données nord":
    - rowgroup:
      - row "Préfixe Occupation":
        - columnheader "Préfixe"
        - columnheader "Occupation"
    - rowgroup:
      - row /Salle A \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+ \d+ %/ [expanded] [level=1]:
        - gridcell /Salle A \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.2\.0\/\d+/
          - button /Ajouter dans \d+\.\d+\.2\.0\/\d+/
        - gridcell /\d+ %/
      - row /Serveurs \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+ \d+ %/ [level=2]:
        - gridcell /Serveurs \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.2\.0\/\d+/
          - button /Ajouter dans \d+\.\d+\.2\.0\/\d+/
        - gridcell /\d+ %/
      - row /Supervision \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ \d+ %/ [level=2] [selected]:
        - gridcell /Supervision \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.\d+\.\d+\/\d+/
          - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
        - gridcell /\d+ %/
      - row /Réserve \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ \d+ %/ [level=2]:
        - gridcell /Réserve \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.\d+\.\d+\/\d+/
          - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
        - gridcell /\d+ %/
      - row /Salle B \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ \d+ %/ [level=1]:
        - gridcell /Salle B \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.\d+\.\d+\/\d+/
          - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
        - gridcell /\d+ %/
      - row /Invités \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ \d+ %/ [level=1]:
        - gridcell /Invités \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
          - text: ""
          - code: /\d+\.\d+\.\d+\.\d+\/\d+/
          - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
        - gridcell /\d+ %/
      - row /Cœur IPv6 \d+:db8::\/\d+ Ajouter dans \d+:db8::\/\d+ < 1 %/ [expanded] [level=1]:
        - gridcell /Cœur IPv6 \d+:db8::\/\d+ Ajouter dans \d+:db8::\/\d+/:
          - text: ""
          - code: /\d+:db8::\/\d+/
          - button /Ajouter dans \d+:db8::\/\d+/
        - gridcell "< 1 %"
      - row /Salle A \d+:db8:\d+::\/\d+ Ajouter dans \d+:db8:\d+::\/\d+ 3 %/ [level=2]:
        - gridcell /Salle A \d+:db8:\d+::\/\d+ Ajouter dans \d+:db8:\d+::\/\d+/:
          - text: ""
          - code: /\d+:db8:\d+::\/\d+/
          - button /Ajouter dans \d+:db8:\d+::\/\d+/
        - gridcell "3 %"
  - region /\d+\.\d+\.\d+\.\d+\/\d+ réseau · Supervision/:
    - heading /\d+\.\d+\.\d+\.\d+\/\d+ réseau · Supervision/ [level=2]
    - toolbar /Actions sur \d+\.\d+\.\d+\.\d+\/\d+/:
      - button "Créer"
      - button "Prochain libre"
      - button "Copier les valeurs"
    - button "Autres actions"
    - button /Inclus dans = \d+\.\d+\.\d+\.\d+\/\d+/
    - button /Retirer le filtre Inclus dans = \d+\.\d+\.\d+\.\d+\/\d+/
    - button "Environnement = Production"
    - button "Retirer le filtre Environnement"
    - grid /Contenu de \d+\.\d+\.\d+\.\d+\/\d+, environnement Production/:
      - rowgroup:
        - row "Objet Usage Environnement (filtrée) Propriétaire":
          - columnheader "Objet"
          - columnheader "Usage"
          - columnheader "Environnement (filtrée)"
          - columnheader "Propriétaire"
      - rowgroup:
        - row /Adresse \d+\.\d+\.\d+\.\d+ Passerelle Production Atelier Nord/:
          - gridcell /Adresse \d+\.\d+\.\d+\.\d+/:
            - img "Adresse"
            - text: ""
          - gridcell "Passerelle"
          - gridcell "Production"
          - gridcell "Atelier Nord"
        - row /Plage \d+\.\d+\.\d+\.\d+–\d+\.\d+\.\d+\.\d+ DHCP Production Atelier Nord/:
          - gridcell /Plage \d+\.\d+\.\d+\.\d+–\d+\.\d+\.\d+\.\d+/:
            - img "Plage"
            - text: ""
          - gridcell "DHCP"
          - gridcell "Production"
          - gridcell "Atelier Nord"
        - row /\(en revue\) Adresse \d+\.\d+\.\d+\.\d+ VIP Production Service Pilote/:
          - gridcell /\(en revue\) Adresse \d+\.\d+\.\d+\.\d+/:
            - text: ""
            - img "Adresse"
            - text: ""
          - gridcell "VIP"
          - gridcell "Production"
          - gridcell "Service Pilote"
        - row /\(en brouillon\) Adresse \d+\.\d+\.\d+\.\d+ Hôte Production Service Pilote/:
          - gridcell /\(en brouillon\) Adresse \d+\.\d+\.\d+\.\d+/:
            - text: ""
            - img "Adresse"
            - text: ""
          - gridcell "Hôte"
          - gridcell "Production"
          - gridcell "Service Pilote"
        - row /Adresse \d+\.\d+\.\d+\.\d+ Hôte Production Service Pilote/:
          - gridcell /Adresse \d+\.\d+\.\d+\.\d+/:
            - img "Adresse"
            - text: ""
          - gridcell "Hôte"
          - gridcell "Production"
          - gridcell "Service Pilote"
        - row /Adresse \d+\.\d+\.\d+\.\d+ Réservée Production Atelier Nord/:
          - gridcell /Adresse \d+\.\d+\.\d+\.\d+/:
            - img "Adresse"
            - text: ""
          - gridcell "Réservée"
          - gridcell "Production"
          - gridcell "Atelier Nord"
    - text: /6 objets sur \d+ · 1 en brouillon · 1 en revue Au présent/
- complementary "Panneau droit":
  - separator "Redimensionner le panneau"
