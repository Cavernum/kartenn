      - button "Plage"
      - button "Préfixe" [disabled]
    - text: Valeur (obligatoire)
    - textbox "Valeur (obligatoire)": /\d+\.\d+\.\d+\.\d+/
    - paragraph: /Prochain libre de \d+\.\d+\.\d+\.\d+\/\d+\./
    - paragraph:
      - text: "À venir :"
      - code: Select
      - text: /\(tâche \d+\)/
    - text: Usage
    - textbox "Usage": Hôte
    - text: Propriétaire
    - textbox "Propriétaire": Service Pilote
    - term: Parent
    - definition: /\d+\.\d+\.\d+\.\d+\/\d+/
    - term: Domaine
    - definition: Centre de données nord
  - button "Fermer le panneau"
  - button "Ajouter au brouillon"
  - button "Choisir l'action"