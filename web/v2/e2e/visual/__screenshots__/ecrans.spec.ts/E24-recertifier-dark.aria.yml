- dialog /Recertifier la dérogation de flux-\d+/:
  - banner:
    - heading /Recertifier la dérogation de flux-\d+/ [level=2]
    - button "Fermer"
  - paragraph: "La dérogation est réévaluée contre la politique du jour : le verdict ci-dessous est celui d'aujourd'hui."
  - paragraph:
    - text: "/Au \\d+-\\d+-\\d+ : Non conforme/"
    - button "Copier Développement vers production deny-deve-prod":
      - text: ""
      - code: deny-deve-prod
    - status
  - paragraph: "Le développement n'atteint jamais la production : ses données n'en sortent pas, ses outils n'y entrent pas."
  - term: Dérogation actuelle
  - definition: /jusqu'au \d+-\d+-\d+/
  - term: Fin du flux
  - definition: sans fin
  - text: Motif (obligatoire)
  - textbox "Motif (obligatoire)": Migration des jeux de test reportée à mars
  - text: Risque accepté (obligatoire)
  - textbox "Risque accepté (obligatoire)": Lecture seule, données anonymisées
  - paragraph:
    - text: "À venir :"
    - code: DateTimeField
    - text: /\(tâche \d+-\d+\)/
  - text: Nouvelle fin (obligatoire)
  - textbox "Nouvelle fin (obligatoire)": /\d+-\d+-\d+/
  - paragraph: "/Au plus 6 mois après aujourd'hui : le \\d+-\\d+-\\d+\\./"
  - paragraph: La politique « Dérogations » (flow.waiver) peut retenir la recertification pour un autre approbateur.
  - contentinfo:
    - button "Annuler"
    - button "Recertifier"