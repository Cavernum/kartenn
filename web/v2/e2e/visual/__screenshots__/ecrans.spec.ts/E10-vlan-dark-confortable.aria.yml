- navigation "Navigation principale":
  - text: kartenn
  - button "Rechercher"
  - button "Référentiel"
  - button "Changesets"
  - button "Réseau" [expanded]
  - list:
    - listitem:
      - link "VLAN":
        - /url: /x/vlan/vlans
    - listitem:
      - link "Groupes de VLAN":
        - /url: /x/vlan/groups
  - button "Machines"
  - button "Politique"
  - button "Flux"
  - button "Administration"
  - button "Barre latérale" [expanded]
- banner:
  - navigation "Fil d'Ariane":
    - list:
      - listitem:
        - link "Réseau":
          - /url: /x/vlan
      - listitem:
        - link "Groupes de VLAN":
          - /url: /x/vlan/groups
      - listitem: campus-ouest
  - button "Présent"
  - button "Brouillon ( 2 )"
  - button "Compte de Camille Martin"
- main:
  - heading "Groupe de VLAN campus-ouest" [level=1]
  - heading "Groupes 3" [level=2]
  - grid "Groupes de VLAN":
    - rowgroup:
      - row "Groupe VID Occ.":
        - columnheader "Groupe"
        - columnheader "VID"
        - columnheader "Occ."
    - rowgroup:
      - row /campus-ouest \d+–\d+ \d+ %/ [selected]:
        - gridcell "campus-ouest"
        - gridcell /\d+–\d+/
        - gridcell /\d+ %/
      - row /campus-est \d+–\d+ \d+ %/:
        - gridcell "campus-est"
        - gridcell /\d+–\d+/
        - gridcell /\d+ %/
      - row /labo \d+–\d+ 6 %/:
        - gridcell "labo"
        - gridcell /\d+–\d+/
        - gridcell "6 %"
  - region /campus-ouest VID \d+–\d+ · ancre site-ouest/:
    - heading /campus-ouest VID \d+–\d+ · ancre site-ouest/ [level=2]
    - 'button /Prochain libre : \d+/'
    - button "Créer"
    - button "Statut ∈ Actif, Réservé, Déprécié"
    - button "Retirer le filtre Statut ∈ Actif, Réservé, Déprécié"
    - button /VID entre \d+\.\.\d+/
    - button /Retirer le filtre VID entre \d+\.\.\d+/
    - term: Utilisés
    - definition: /\d+ sur \d+/
    - term: Libres
    - definition: /\d+ \(\d+–\d+, \d+–\d+\)/
    - term: Réservés
    - definition: "1"
    - grid "VLAN du groupe campus-ouest":
      - rowgroup:
        - row "VID Nom Statut Réseaux Interfaces":
          - columnheader "VID"
          - columnheader "Nom"
          - columnheader "Statut"
          - columnheader "Réseaux"
          - columnheader "Interfaces"
      - rowgroup:
        - row /\d+ admin Actif \d+\.\d+\.2\.0\/\d+ \d+/:
          - gridcell /\d+/
          - gridcell "admin"
          - gridcell "Actif"
          - gridcell /\d+\.\d+\.2\.0\/\d+/
          - gridcell /\d+/
        - row /\d+ serveurs Actif 2 réseaux \d+/:
          - gridcell /\d+/
          - gridcell "serveurs"
          - gridcell "Actif"
          - gridcell "2 réseaux"
          - gridcell /\d+/
        - row /\d+ voix Déprécié — 0/:
          - gridcell /\d+/
          - gridcell "voix"
          - gridcell "Déprécié"
          - gridcell "—"
          - gridcell "0"
        - row /\(en brouillon\) \d+ sauvegarde Actif — 0/:
          - gridcell /\(en brouillon\) \d+/
          - gridcell "sauvegarde"
          - gridcell "Actif"
          - gridcell "—"
          - gridcell "0"
        - row /\d+ reserve-wifi Réservé — 0/:
          - gridcell /\d+/
          - gridcell "reserve-wifi"
          - gridcell "Réservé"
          - gridcell "—"
          - gridcell "0"
        - row /\d+ serveurs-b Actif \d+\.\d+\.2\.0\/\d+ \d+/:
          - gridcell /\d+/
          - gridcell "serveurs-b"
          - gridcell "Actif"
          - gridcell /\d+\.\d+\.2\.0\/\d+/
          - gridcell /\d+/
        - row /\d+ supervision Actif \d+\.\d+\.\d+\.\d+\/\d+ 6/:
          - gridcell /\d+/
          - gridcell "supervision"
          - gridcell "Actif"
          - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
          - gridcell "6"
    - text: "/7 VLAN sur \\d+ · 1 en brouillon Colonne « Interfaces » : plugin Machines/"