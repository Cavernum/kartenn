      - list:
        - listitem:
          - code: app-meme-env
          - text: La destination n'est pas en production, recette, développement.
        - listitem:
          - code: rece-vers-prod
          - text: La source n'est pas en recette.
        - listitem:
          - code: deny-deve-prod
          - text: La source n'est pas en développement.
      - heading "Conditions" [level=4]
      - list:
        - listitem:
          - text: "Non évaluée : sans dossier"
          - button "Copier justification-requise":
            - text: ""
            - code: justification-requise
          - status
          - paragraph: Un flux entre deux environnements différents porte une justification dans son dossier.
    - status:
      - paragraph: Suite attendue
      - text: "/Déclaré tel quel, ce flux part en instruction : les 2 paires vers l'interface d'administration de srv-app-\\d+ n'y sont approuvables qu'avec une dérogation\\. Viser l'interface eth0 le rend conforme à la matrice de flux\\./"
- button "Ouvrir le panneau"