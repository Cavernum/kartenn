            - columnheader "Adresse destination"
            - columnheader "Verdict"
            - columnheader "Élément décisif"
        - rowgroup:
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth0 Autorisé app-meme-env \(prod, prod\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth0/
            - gridcell "Autorisé"
            - gridcell "app-meme-env (prod, prod)":
              - code: app-meme-env
              - text: ""
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth0 Autorisé app-meme-env \(prod, prod\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth0/
            - gridcell "Autorisé"
            - gridcell "app-meme-env (prod, prod)":
              - code: app-meme-env
              - text: ""
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth1 Refusé no_rule \(prod, admin\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth1/
            - gridcell "Refusé"
            - gridcell "no_rule (prod, admin)":
              - code: no_rule
              - text: ""
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth0 Autorisé app-meme-env \(prod, prod\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth0/
            - gridcell "Autorisé"
            - gridcell "app-meme-env (prod, prod)":
              - code: app-meme-env
              - text: ""
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth0 Autorisé app-meme-env \(prod, prod\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth0/
            - gridcell "Autorisé"
            - gridcell "app-meme-env (prod, prod)":
              - code: app-meme-env
              - text: ""
          - row /\d+\.\d+\.\d+\.\d+ \d+\.\d+\.\d+\.\d+ eth1 Refusé no_rule \(prod, admin\)/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /\d+\.\d+\.\d+\.\d+ eth1/
            - gridcell "Refusé"
            - gridcell "no_rule (prod, admin)":
              - code: no_rule
              - text: ""
    - region "Explication":
      - heading "Explication" [level=3]
      - list:
        - listitem:
          - text: Autorisé
          - button "Copier app-meme-env":
            - text: ""
            - code: app-meme-env
          - status
          - text: règle, combinaison
          - code: (prod, prod)
          - text: · 4 paires
          - paragraph: Les applications d'un même environnement se parlent par leurs services déclarés.
        - listitem:
          - text: Refusé
          - button "Copier no_rule":
            - text: ""
            - code: no_rule
          - status
          - text: cause, combinaison
          - code: (prod, admin)
          - text: · 2 paires
          - paragraph: "Aucune règle n'autorise le type Applicatif de production vers administration : le refus par défaut s'applique."
      - heading "Valeurs résolues des axes cités" [level=4]
      - grid "Valeurs résolues des axes cités, par adresse":
        - rowgroup:
          - row "Adresse Extrémité Environnement Sensibilité":
            - columnheader "Adresse"
            - columnheader "Extrémité"
            - columnheader "Environnement"
            - columnheader "Sensibilité"
        - rowgroup:
          - row /\d+\.\d+\.\d+\.\d+ Source srv-web-\d+ eth0 Production héritée de \d+\.\d+\.2\.0\/\d+ Interne héritée de \d+\.\d+\.2\.0\/\d+/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /Source srv-web-\d+ eth0/
            - gridcell /Production héritée de \d+\.\d+\.2\.0\/\d+/
            - gridcell /Interne héritée de \d+\.\d+\.2\.0\/\d+/
          - row /\d+\.\d+\.\d+\.\d+ Source srv-web-\d+ eth0 Production héritée de \d+\.\d+\.2\.0\/\d+ Interne héritée de \d+\.\d+\.2\.0\/\d+/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /Source srv-web-\d+ eth0/
            - gridcell /Production héritée de \d+\.\d+\.2\.0\/\d+/
            - gridcell /Interne héritée de \d+\.\d+\.2\.0\/\d+/
          - row /\d+\.\d+\.\d+\.\d+ Destination srv-app-\d+ eth0 Production héritée de \d+\.\d+\.2\.0\/\d+ Interne héritée de \d+\.\d+\.2\.0\/\d+/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /Destination srv-app-\d+ eth0/
            - gridcell /Production héritée de \d+\.\d+\.2\.0\/\d+/
            - gridcell /Interne héritée de \d+\.\d+\.2\.0\/\d+/
          - row /\d+\.\d+\.\d+\.\d+ Destination srv-app-\d+ eth0 Production héritée de \d+\.\d+\.2\.0\/\d+ Interne héritée de \d+\.\d+\.2\.0\/\d+/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /Destination srv-app-\d+ eth0/
            - gridcell /Production héritée de \d+\.\d+\.2\.0\/\d+/
            - gridcell /Interne héritée de \d+\.\d+\.2\.0\/\d+/
          - row /\d+\.\d+\.\d+\.\d+ Destination srv-app-\d+ eth1 Administration posée sur \d+\.\d+\.\d+\.\d+\/\d+ Interne héritée de \d+\.\d+\.2\.0\/\d+/:
            - gridcell /\d+\.\d+\.\d+\.\d+/
            - gridcell /Destination srv-app-\d+ eth1/
            - gridcell /Administration posée sur \d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell /Interne héritée de \d+\.\d+\.2\.0\/\d+/
