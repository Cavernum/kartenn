- dialog /Prolonger flux-\d+/:
  - banner:
    - heading /Prolonger flux-\d+/ [level=2]
    - button "Fermer"
  - paragraph: Une prolongation repasse par l'instruction quand la portion ajoutée n'est pas conforme sans réserve ; rien ne se prolonge seul.
  - paragraph:
    - text: "À venir :"
    - code: DateTimeField
    - text: /\(tâche \d+-\d+\)/
  - text: Nouvelle fin (obligatoire)
  - textbox "Nouvelle fin (obligatoire)": /\d+-\d+-\d+/
  - paragraph: "/Fin actuelle : \\d+-\\d+-\\d+\\. Au plus \\d+ mois après la décision\\./"
  - region "Pré-vérification de la portion ajoutée":
    - heading "Pré-vérification de la portion ajoutée" [level=3]
    - paragraph:
      - text: /\d+-\d+-\d+ → \d+-\d+-\d+ Sous réserve À instruire/
      - button "Copier Administration par le bastion admin-par-bastion":
        - text: ""
        - code: admin-par-bastion
      - status
    - paragraph:
      - text: /Dès le \d+-\d+-\d+, la règle admin-par-bastion demande le motif/
      - code: bastion-admin
      - text: ": la session part du bastion, nominative et enregistrée."
    - paragraph: Vérifiée avec le dossier du flux ; rien n'est écrit.
  - contentinfo:
    - button "Annuler"
    - button "Demander la prolongation"