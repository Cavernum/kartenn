      - button "Créer"
      - button "Colonnes"
      - button "Plus d'actions"
    - button "Domaine = Centre de données nord"
    - button "Retirer le filtre Domaine = Centre de données nord"
    - button /Inclus dans = \d+\.\d+\.2\.0\/\d+/
    - button /Retirer le filtre Inclus dans = \d+\.\d+\.2\.0\/\d+/
    - button "Usage ∈ Hôte, VIP"
    - button "Retirer le filtre Usage ∈ Hôte, VIP"
    - button "Propriétaire = Atelier Nord (en brouillon)"
    - button "Retirer le filtre Propriétaire"
    - button /Créée après = \d+-\d+-\d+/
    - button "Retirer le filtre Créée après"
    - text: "/Date invalide : le mois va de \\d+ à \\d+\\./"
    - button "Ajouter un filtre"
    - paragraph:
      - text: "À venir :"
      - code: FilterPicker
      - text: /\(tâche \d+\)/
    - status: 3 adresses sélectionnées
    - button "Action groupée" [expanded]
    - button /Tout sélectionner \(1 \d+\)/
    - paragraph:
      - text: "À venir :"
      - code: Checkbox
      - text: /\(tâche \d+\)/
    - button "Annuler la sélection"
    - grid "Adresses, filtrées":
