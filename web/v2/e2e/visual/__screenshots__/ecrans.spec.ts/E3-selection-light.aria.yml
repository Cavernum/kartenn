        - row /\d+\.\d+\.\d+\.\d+ Hôte Production Atelier Nord site-ouest srv-app-\d+ \d+/ [selected]:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Production"
          - gridcell "Atelier Nord"
          - gridcell "site-ouest"
