- main:
  - heading "Adresses" [level=1]
  - region /Adresses 1 \d+/:
    - heading /Adresses 1 \d+/ [level=2]
    - button "Créer"
    - grid "Adresses":
      - rowgroup:
        - row "Valeur Usage Propriétaire Site":
          - columnheader "Valeur"
          - columnheader "Usage"
          - columnheader "Propriétaire"
          - columnheader "Site"
      - rowgroup:
        - row /\d+\.\d+\.\d+\.\d+ Hôte Atelier Nord site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Atelier Nord"
          - gridcell "site-ouest"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ VIP Atelier Nord site-ouest/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "VIP"
          - gridcell "Atelier Nord"
          - gridcell "site-ouest"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ Hôte Atelier Sud site-ouest/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Atelier Sud"
          - gridcell "site-ouest"
        - row /\d+\.\d+\.\d+\.\d+ Hôte Service Pilote site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Service Pilote"
          - gridcell "site-ouest"
        - row /\(en brouillon\) \d+\.\d+\.\d+\.\d+ Hôte Service Pilote site-ouest/:
          - gridcell /\(en brouillon\) \d+\.\d+\.\d+\.\d+/
          - gridcell "Hôte"
          - gridcell "Service Pilote"
          - gridcell "site-ouest"
        - row /\d+\.\d+\.\d+\.\d+ Réservée Service Pilote site-ouest/:
          - gridcell /\d+\.\d+\.\d+\.\d+/
          - gridcell "Réservée"
          - gridcell "Service Pilote"
          - gridcell "site-ouest"
- complementary "Brouillon":
  - heading "Brouillon" [level=2]
  - button "Fermer"
  - paragraph: 3 opérations, non soumises.
  - list:
    - listitem:
      - code: /\d+\.\d+\.\d+\.\d+/
      - text: "Usage :"
      - deletion: Hôte
      - text: →
      - insertion: VIP
      - button /Retirer l'opération « Usage » sur \d+\.\d+\.\d+\.\d+/
    - listitem:
      - code: /\d+\.\d+\.\d+\.\d+/
      - text: "Propriétaire :"
      - deletion: Atelier Nord
      - text: →
      - insertion: Atelier Sud
      - button /Retirer l'opération « Propriétaire » sur \d+\.\d+\.\d+\.\d+/
    - listitem:
      - code: /\d+\.\d+\.\d+\.\d+/
      - text: Créer l'adresse (Hôte, Service Pilote)
      - button /Retirer l'opération « Créer l'adresse » sur \d+\.\d+\.\d+\.\d+/
  - region "Simulation":
    - heading "Simulation" [level=3]
    - text: Simulation en cours des 3 opérations…
    - status: Chargement
  - text: Motif (obligatoire)
  - textbox "Motif (obligatoire)"
  - paragraph: Reporté dans l'historique de chaque objet.
  - term: Effet au
  - definition: présent
  - term: Revue
  - definition: non requise
  - text: Simulation en cours
  - button "Tout abandonner"
  - button "Soumettre" [disabled]