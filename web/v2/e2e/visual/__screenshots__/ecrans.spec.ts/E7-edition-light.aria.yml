- main:
  - heading "Rôles" [level=1]
  - region "Rôles 6":
    - heading "Rôles 6" [level=2]
    - toolbar "Actions des rôles":
      - button "Créer"
    - grid "Rôles":
      - rowgroup:
        - row "Rôle Intégré Permissions Liaisons Description":
          - columnheader "Rôle"
          - columnheader "Intégré"
          - columnheader "Permissions"
          - columnheader "Liaisons"
          - columnheader "Description"
      - rowgroup:
        - row /Lecteur reader oui \d+ \d+ Lecture de tout le référentiel/:
          - gridcell "Lecteur reader":
            - text: ""
            - code: reader
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell /\d+/
          - gridcell "Lecture de tout le référentiel"
        - row /Éditeur editor oui \d+ \d+ Édition du référentiel, sans l'administration/:
          - gridcell "Éditeur editor":
            - text: ""
            - code: editor
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell /\d+/
          - gridcell "Édition du référentiel, sans l'administration"
        - row /Administrateur admin oui \d+ 2 Tous les droits/:
          - gridcell "Administrateur admin":
            - text: ""
            - code: admin
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell "2"
          - gridcell "Tous les droits"
        - row "(en brouillon) Lecteur réseau lecteur-reseau non 8 9 Lecture du réseau et des machines" [selected]:
          - gridcell "(en brouillon) Lecteur réseau lecteur-reseau":
            - text: ""
            - code: lecteur-reseau
          - gridcell "non"
          - gridcell "8"
          - gridcell "9"
          - gridcell "Lecture du réseau et des machines"
        - row "Instructeur instructeur-flux non 3 4 Instruction des demandes de flux":
          - gridcell "Instructeur instructeur-flux":
            - text: ""
            - code: instructeur-flux
          - gridcell "non"
          - gridcell "3"
          - gridcell "4"
          - gridcell "Instruction des demandes de flux"
        - row "import-ipam non 8 1 Compte d'import":
          - gridcell "import-ipam":
            - code: import-ipam
          - gridcell "non"
          - gridcell "8"
          - gridcell "1"
          - gridcell "Compte d'import"
