- main:
  - heading /Préfixe \d+\.\d+\.\d+\.\d+\/\d+, lu au 3 novembre \d+/ [level=1]
  - region /\d+\.\d+\.\d+\.\d+\/\d+ préfixe · réseau · Supervision/:
    - heading /\d+\.\d+\.\d+\.\d+\/\d+ préfixe · réseau · Supervision/ [level=2]
    - toolbar "Actions du préfixe":
      - button "Lire au présent"
      - button "Comparer avec le présent"
      - button "Modifier" [disabled]
      - button "Copier l'identifiant"
      - button "Clore…" [disabled]
    - paragraph: /Valeurs valides au 3 novembre \d+ \(version v3\)\. Les écritures reprennent au présent ; le brouillon peut recevoir des opérations datées\./
    - term: Propriétaire
    - definition: Atelier Nord
    - term: Site
    - definition: site-ouest
    - term: Version lue
    - definition: v3
  - heading "Chronologie des versions 4" [level=2]
  - grid /Versions de \d+\.\d+\.\d+\.\d+\/\d+ ; la v3 est celle de la date lue/:
    - rowgroup:
      - row "Version Valide Connue du Motif":
        - columnheader "Version"
        - columnheader "Valide"
        - columnheader "Connue du"
        - columnheader "Motif"
    - rowgroup:
      - row /v4 \d+-\d+-\d+ → … \d+-\d+-\d+ Bascule des VIP salle B/:
        - gridcell "v4"
        - gridcell /\d+-\d+-\d+ → …/
        - gridcell /\d+-\d+-\d+/
        - gridcell "Bascule des VIP salle B"
      - row /v3 · lue \d+-\d+-\d+ → \d+-\d+-\d+ \d+-\d+-\d+ Rattachement au site ouest/ [selected]:
        - gridcell "v3 · lue"
        - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
        - gridcell /\d+-\d+-\d+/
        - gridcell "Rattachement au site ouest"
      - row /v2 \d+-\d+-\d+ → \d+-\d+-\d+ \d+-\d+-\d+ Correction rétroactive du propriétaire/:
        - gridcell "v2"
        - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
        - gridcell /\d+-\d+-\d+/
        - gridcell "Correction rétroactive du propriétaire"
      - row /v1 \d+-\d+-\d+ → \d+-\d+-\d+ \d+-\d+-\d+ Import initial/:
        - gridcell "v1"
        - gridcell /\d+-\d+-\d+ → \d+-\d+-\d+/
        - gridcell /\d+-\d+-\d+/
        - gridcell "Import initial"