- main:
  - heading "Rôles" [level=1]
  - region "Rôles 6":
    - heading "Rôles 6" [level=2]
    - button "Créer"
    - grid "Rôles":
      - rowgroup:
        - row "Rôle Intégré Permissions Liaisons":
          - columnheader "Rôle"
          - columnheader "Intégré"
          - columnheader "Permissions"
          - columnheader "Liaisons"
      - rowgroup:
        - row /Lecteur reader oui \d+ \d+/:
          - gridcell "Lecteur reader":
            - text: ""
            - code: reader
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell /\d+/
        - row /Éditeur editor oui \d+ \d+/:
          - gridcell "Éditeur editor":
            - text: ""
            - code: editor
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell /\d+/
        - row /Administrateur admin oui \d+ 2/:
          - gridcell "Administrateur admin":
            - text: ""
            - code: admin
          - gridcell "oui"
          - gridcell /\d+/
          - gridcell "2"
        - row "Lecteur réseau lecteur-reseau non 6 5" [selected]:
          - gridcell "Lecteur réseau lecteur-reseau":
            - text: ""
            - code: lecteur-reseau
          - gridcell "non"
          - gridcell "6"
          - gridcell "5"
        - row "Instructeur instructeur-flux non 3 4":
          - gridcell "Instructeur instructeur-flux":
            - text: ""
            - code: instructeur-flux
          - gridcell "non"
          - gridcell "3"
          - gridcell "4"
        - row "import-ipam non 8 1":
          - gridcell "import-ipam":
            - code: import-ipam
          - gridcell "non"
          - gridcell "8"
          - gridcell "1"
  - heading "Lecteur réseau lecteur-reseau" [level=2]
  - button "Modifier"
  - heading "Permissions · 6" [level=3]
  - list:
    - listitem:
      - text: Lire les préfixes
      - button "Copier core.prefix.read":
