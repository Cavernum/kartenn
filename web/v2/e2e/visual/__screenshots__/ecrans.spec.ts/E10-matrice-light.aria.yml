- main:
  - heading "Matrice de politique applicatif" [level=1]
  - region "Matrice applicatif":
    - heading "Matrice applicatif" [level=2]
    - 'button "Type de flux : applicatif"'
    - paragraph:
      - text: "À venir :"
      - code: Select
      - text: /\(tâche \d+\)/
    - toolbar "Actions de la matrice":
      - button "3 règles hors vue"
      - button "Simuler le brouillon"
      - button "Exporter"
    - 'grid "Matrice applicatif : source en ligne, destination en colonne"':
      - rowgroup:
        - row "Source → destination Production Préproduction Recette Intégration Développement":
          - columnheader "Source → destination"
          - columnheader "Production"
          - columnheader "Préproduction"
          - columnheader "Recette"
          - columnheader "Intégration"
          - columnheader "Développement"
      - rowgroup:
        - row "Production Autoriser Interdire Interdire Interdire Interdire":
          - rowheader "Production"
          - gridcell "Autoriser"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Interdire"
        - row "Préproduction Sous motif (en revue) Autoriser Refus par défaut Interdire Interdire":
          - rowheader "Préproduction"
          - gridcell "Sous motif (en revue)"
          - gridcell "Autoriser"
          - gridcell "Refus par défaut"
          - gridcell "Interdire"
          - gridcell "Interdire"
        - row "Recette Sous motif (en brouillon) Refus par défaut Autoriser Autoriser Refus par défaut":
          - rowheader "Recette"
          - gridcell "Sous motif (en brouillon)"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
          - gridcell "Refus par défaut"
        - row "Intégration Interdire Refus par défaut Autoriser Autoriser Autoriser":
          - rowheader "Intégration"
          - gridcell "Interdire"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
        - row "Développement Interdire Interdire Refus par défaut Autoriser Autoriser":
          - rowheader "Développement"
          - gridcell "Interdire"
          - gridcell "Interdire"
          - gridcell "Refus par défaut"
          - gridcell "Autoriser"
          - gridcell "Autoriser"
    - text: /Brouillon · 1 cellule · 1 en revue 1 s'ouvre sous réserve · \d+ non conformes à la matrice · 0 conforme de nouveau/
- complementary "Panneau droit":
