- dialog /\d+\.\d+\.\d+\.\d+ a changé entre-temps/:
  - banner:
    - heading /\d+\.\d+\.\d+\.\d+ a changé entre-temps/ [level=2]
    - button "Fermer"
  - paragraph: "Quelqu'un l'a modifiée depuis votre lecture : rien n'a été écrit."
  - status:
    - paragraph: Version lue v4, version actuelle v5
    - list:
      - listitem:
        - text: Condition If-Match non remplie
        - button "Copier precondition-failed":
          - text: ""
          - code: precondition-failed
        - status
  - term: Valeur actuelle
  - definition: Atelier Sud
  - term: Modifiée par
  - definition: /Lou Bernard, \d+:\d+/
  - text: Votre saisie, gardée
  - textbox "Votre saisie, gardée": Atelier Nord
  - paragraph: /Propriétaire de \d+\.\d+\.\d+\.\d+/
  - contentinfo:
    - button "Garder la valeur actuelle"
    - button "Réappliquer ma saisie"