- dialog "L'objet a changé depuis votre lecture":
  - banner:
    - heading "L'objet a changé depuis votre lecture" [level=2]
    - button "Fermer"
  - paragraph: "/Quelqu'un a modifié \\d+\\.\\d+\\.\\d+\\.\\d+ après que vous l'avez lue : rien n'a été écrit, votre saisie est gardée\\./"
  - alert:
    - paragraph: "Erreur : Vous avez lu la version v4, la version actuelle est la v5."
    - list:
      - listitem:
        - text: Relisez la valeur actuelle, puis réappliquez ou abandonnez votre saisie.
        - button "Copier urn:kartenn:problem:precondition-failed":
          - text: ""
          - code: urn:kartenn:problem:precondition-failed
        - status
  - term: Valeur actuelle
  - definition: Atelier Sud
  - term: Modifiée par
  - definition: /Lou Bernard, \d+:\d+/
  - text: Votre saisie, gardée
  - textbox "Votre saisie, gardée": Atelier Nord
  - paragraph: /Propriétaire de \d+\.\d+\.\d+\.\d+/
  - contentinfo:
    - button "Garder la valeur actuelle"
    - button "Réappliquer ma saisie"