      - button "Interdire"
      - button "Aucune règle"
    - text: Motif exigé (obligatoire)
    - combobox "Motif exigé (obligatoire)": Lecture d'API
    - paragraph: Une cellule sous motif n'autorise que les flux qui le portent.
    - text: Texte pédagogique (fr)
    - textbox "Texte pédagogique (fr)"
    - paragraph: Exigé pour Interdire ; facultatif ici, le texte du motif s'affiche.
    - text: Libellé
    - textbox "Libellé": Lecture des API de production depuis la recette
    - paragraph: "« Aucune règle » clôt la règle de la cellule : elle redevient un refus par défaut."
  - button "Largeur du panneau"
  - button "Fermer le panneau"
  - button "Appliquer seule"
  - button "Ajouter au brouillon"
