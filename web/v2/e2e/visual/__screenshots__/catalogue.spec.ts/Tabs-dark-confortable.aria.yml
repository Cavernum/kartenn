- main:
  - region "Tabs":
    - heading "Tabs" [level=1]
    - paragraph: "Motif : Tabs (activation manuelle)"
    - figure "first — Premier onglet actif ; onglets de plugin en chargement et en erreur":
      - tablist "Fiche du préfixe":
        - tab "Attributs" [selected]
        - tab /Adresses \d+/
        - tab "Historique"
        - tab "VLAN (en chargement)"
        - tab "Flux (en erreur)"
      - tabpanel "Attributs":
        - paragraph: Panneau « Attributs ».
      - code: first
      - text: ""
    - figure "second — Un autre onglet actif, avec compteur":
      - tablist "Fiche du préfixe":
        - tab "Attributs"
        - tab /Adresses \d+/ [selected]
        - tab "Historique"
        - tab "VLAN (en chargement)"
        - tab "Flux (en erreur)"
      - tabpanel /Adresses \d+/:
        - paragraph: Panneau « Adresses ».
      - code: second
      - text: ""
    - figure "hover — Survol d'un onglet":
      - tablist "Fiche du préfixe":
        - tab "Attributs" [selected]
        - tab /Adresses \d+/
        - tab "Historique"
        - tab "VLAN (en chargement)"
        - tab "Flux (en erreur)"
      - tabpanel "Attributs":
        - paragraph: Panneau « Attributs ».
      - code: hover
      - text: ""
    - figure "focus — Focus visible sur l'onglet actif":
      - tablist "Fiche du préfixe":
        - tab "Attributs" [selected]
        - tab /Adresses \d+/
        - tab "Historique"
        - tab "VLAN (en chargement)"
        - tab "Flux (en erreur)"
      - tabpanel "Attributs":
        - paragraph: Panneau « Attributs ».
      - code: focus
      - text: ""