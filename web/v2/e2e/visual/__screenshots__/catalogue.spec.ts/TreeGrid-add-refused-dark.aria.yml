- main:
  - region "TreeGrid":
    - heading "TreeGrid" [level=1]
    - paragraph: "Motif : Treegrid"
    - 'figure /add-refused — « \+ » refusé : visible, grisé, la permission manquante dite au survol et au focus \(REQ-\d+-\d+\)/':
      - treegrid "Arbre des préfixes":
        - rowgroup:
          - row "Préfixe Environnement Occupation":
            - columnheader "Préfixe"
            - columnheader "Environnement"
            - columnheader "Occupation"
        - rowgroup:
          - row "Centre de données nord" [expanded] [level=1]:
            - gridcell "Centre de données nord"
            - gridcell
            - gridcell
          - row /Serveurs \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+ Production \d+ %/ [expanded] [level=2]:
            - gridcell /Serveurs \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
              - button /Ajouter dans \d+\.\d+\.2\.0\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Bases \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+ Production \d+ %/ [level=3]:
            - gridcell /Bases \d+\.\d+\.2\.0\/\d+ Ajouter dans \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
              - button /Ajouter dans \d+\.\d+\.2\.0\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Supervision \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ Recette \d+ %/ [level=3]:
            - gridcell /Supervision \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
              - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Recette"
            - gridcell /\d+ %/
          - row /Postes \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ Production \d+ %/ [level=2]:
            - gridcell /Postes \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
              - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Invités \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+ Développement 3 %/ [level=2] [selected]:
            - gridcell /Invités \d+\.\d+\.\d+\.\d+\/\d+ Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
              - button /Ajouter dans \d+\.\d+\.\d+\.\d+\/\d+/ [disabled]
            - gridcell "Développement"
            - gridcell "3 %"
      - status
      - alert
      - code: add-refused
      - text: ""