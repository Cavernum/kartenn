- main:
  - region "Panel":
    - heading "Panel" [level=1]
    - paragraph: "Motif : section (titre h2 ; région nommée pour le panneau principal seul)"
    - 'figure "list-alone — Panneau de liste sans hôte qui le remplit (onglet, tiroir) : la grille garde la hauteur d''une liste"':
