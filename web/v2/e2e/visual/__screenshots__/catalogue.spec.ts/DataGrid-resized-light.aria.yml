- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: "Motif : Grid (maison) ; une seule grille, lignes en subgrid ; tri et filtre de colonne"
    - figure "resized — Colonnes redimensionnées (libellé élargi, responsable réduit) ; jamais plus étroites que leur en-tête":
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Préfixe Libellé Environnement Occupation Responsable":
            - columnheader "Préfixe":
              - text: ""
              - 'button "Filtrer : Préfixe"'
              - separator "Redimensionner la colonne Préfixe"
            - columnheader "Libellé":
              - text: ""
              - separator "Redimensionner la colonne Libellé"
            - columnheader "Environnement":
              - text: ""
              - 'button "Filtrer : Environnement"'
              - separator "Redimensionner la colonne Environnement"
            - columnheader "Occupation":
              - text: ""
              - separator "Redimensionner la colonne Occupation"
            - columnheader "Responsable":
              - text: ""
              - separator "Redimensionner la colonne Responsable"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs de bases Production \d+ % Équipe réseau/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs de bases"
            - gridcell "Production"
            - gridcell /\d+ %/
            - gridcell "Équipe réseau"
          - row /\d+\.\d+\.2\.0\/\d+ Postes du siège Recette \d+ % Équipe postes/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Postes du siège"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Supervision Développement \d+ % Exploitation/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Supervision"
            - gridcell "Développement"
            - gridcell /\d+ %/
            - gridcell "Exploitation"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Sauvegardes Production 3 % Équipe réseau/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "Production"
            - gridcell "3 %"
            - gridcell "Équipe réseau"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Invités Recette \d+ % Équipe postes/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
      - alert
      - code: resized
      - text: ""