      - link "Voir l'état open seul":
        - /url: /_ui/c/CommandPalette?mode=light&densite=confortable&etat=open
      - code: open
      - text: ""
    - figure "empty — Aucune entrée":
      - link "Voir l'état empty seul":
        - /url: /_ui/c/CommandPalette?mode=light&densite=confortable&etat=empty
      - code: empty
      - text: ""
    - figure "loading — Chargement des objets":
      - link "Voir l'état loading seul":
        - /url: /_ui/c/CommandPalette?mode=light&densite=confortable&etat=loading
      - code: loading
      - text: ""
    - 'figure "keyboard — Au clavier : ouverte par un bouton, filtrée à la saisie, la première entrée mise en avant, Entrée lance, Échap ferme"':
      - button "Ouvrir la palette"
      - paragraph: "Commande lancée : aucune"
      - code: keyboard
      - text: ""