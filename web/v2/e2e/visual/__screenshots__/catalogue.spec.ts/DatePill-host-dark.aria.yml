- main:
  - dialog "Lire à une date":
    - button "Fermer"
    - heading "Lire à une date" [level=2]
    - group "Valide au":
      - text: ""
      - spinbutton "Année"
      - spinbutton "Mois"
      - spinbutton "Jour"
      - spinbutton "Heure"
      - spinbutton "Minutes"
      - text: /Europe\/Paris UTC\+\d+:\d+/
      - 'button "Choisir la date : Valide au"'
      - paragraph: "Ce qui est vrai à cette date, passée ou à venir ; vide : maintenant."
    - 'group "Raccourcis : Valide au"':
      - button "Maintenant"
      - button "Hier"
      - button "Début du mois"
    - group "Connu au":
      - text: ""
      - spinbutton "Année" [invalid]
      - spinbutton "Mois" [invalid]
      - spinbutton "Jour" [invalid]
      - spinbutton "Heure" [invalid]
      - spinbutton "Minutes" [invalid]
      - text: /Europe\/Paris UTC\+\d+:\d+/
      - 'button "Choisir la date : Connu au"'
      - paragraph: "Refusé par le serveur : cette date dépasse son heure."
      - paragraph: "Ce que la base savait à cette date ; vide : ce qu'elle sait."
    - 'group "Raccourcis : Connu au"':
      - button "Maintenant"
      - button "Hier"
      - button "Début du mois"
    - status
    - button "Revenir au présent"
    - button "Appliquer"
  - region "DatePill":
    - heading "DatePill" [level=1]
    - paragraph: "Motif : Button qui ouvre un Dialog non modal (le choix de la période)"
    - figure /host — Refus de l'API \(\d+ sur as_of\) rendu sur son champ, la couche ouverte/:
      - 'button /Date de lecture : Connu au 1 déc\. \d+, \d+:\d+ Europe\/Paris/ [expanded]':
        - text: ""
        - time: /1 déc\. \d+, \d+:\d+/
        - text: ""
      - code: host
      - text: ""