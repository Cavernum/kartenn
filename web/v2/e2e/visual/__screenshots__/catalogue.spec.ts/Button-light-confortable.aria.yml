- main:
  - region "Button":
    - heading "Button" [level=1]
    - paragraph: "Motif : Button"
    - figure "variants — Les quatre variantes, au repos":
      - button "primary"
      - button "secondary"
      - button "ghost"
      - button "danger"
      - code: variants
      - text: ""
    - figure "primary — Principal":
      - button "Appliquer"
      - code: primary
      - text: ""
    - figure "secondary-icon — Secondaire avec icône":
      - button "Ajouter un préfixe"
      - code: secondary-icon
      - text: ""
    - figure "hover — Survol":
      - button "Appliquer"
      - code: hover
      - text: ""
    - figure "focus — Focus visible":
      - button "Annuler"
      - code: focus
      - text: ""
    - figure "pressed — Bouton bascule enfoncé (aria-pressed)":
      - button "Filtres" [pressed]
      - code: pressed
      - text: ""
    - figure "shortcut — Raccourci affiché (aria-keyshortcuts)":
      - button "Appliquer"
      - code: shortcut
      - text: ""
    - 'figure "loading — En cours : focalisable, aria-busy"':
      - button "Appliquer (Chargement)" [disabled]
      - code: loading
      - text: ""
    - figure "disabled — Désactivé":
      - button "Appliquer" [disabled]
      - code: disabled
      - text: ""
    - 'figure "forbidden — Interdit par les droits : focalisable, aria-disabled, « Il faut … » au focus"':
      - button "Modifier" [disabled]
      - code: forbidden
      - text: ""
    - figure "danger — Destructif":
      - button "Supprimer"
      - code: danger
      - text: ""
    - figure /small — Petit \(\d+ px\)/:
      - button "Modifier"
      - code: small
      - text: ""
    - figure /large — Grand \(\d+ px\)/:
      - button "Modifier"
      - code: large
      - text: ""
    - figure "alignment — Bouton, champ, liste de choix, bouton-icône et pastilles côte à côte, par taille":
      - button "Appliquer"
      - button "Ajouter"
      - text: Recherche sm
      - textbox "Recherche sm":
        - /placeholder: Préfixe
      - text: Usage sm
      - combobox "Usage sm": Hôte
      - button "Actions sm"
      - button "Production"
      - status
      - text: Conforme
      - button "Appliquer"
      - button "Ajouter"
      - text: Recherche md
      - textbox "Recherche md":
        - /placeholder: Préfixe
      - text: Usage md
      - combobox "Usage md": Hôte
      - button "Actions md"
      - button "Production"
      - status
      - text: Conforme
      - button "Appliquer"
      - button "Ajouter"
      - text: Recherche lg
      - textbox "Recherche lg":
        - /placeholder: Préfixe
      - text: Usage lg
      - combobox "Usage lg": Hôte
      - button "Actions lg"
      - button "Production"
      - status
      - text: Conforme
      - code: alignment
      - text: ""
    - 'figure "keyboard — Au clavier : action, bascule, occupé, désactivé, interdit, bouton-icône"':
      - button "Enregistrer"
      - button "Filtres"
      - button "Recharger (Chargement)" [disabled]
      - button "Supprimer" [disabled]
      - button "Modifier" [disabled]
      - button "Copier"
      - status
      - code: keyboard
      - text: ""