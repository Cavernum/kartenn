- main:
  - region "SidePanel":
    - heading "SidePanel" [level=1]
    - paragraph: "Motif : région complementary (non modale) + Tabs ; poignée Window Splitter ; en feuille, Dialog (Modal)"
    - 'figure "cell-choice — Grille dans l''onglet Détail, l''usage choisi dans la cellule : la première Échap ferme la liste, la seconde annule la saisie, le panneau reste ; depuis la cellule, Échap ferme le panneau"':
      - button "Brouillon 3 opérations" [expanded]
      - heading /Contenu de \d+\.\d+\.2\.0\/\d+/ [level=2]
      - grid "Préfixes":
        - rowgroup:
          - row "Préfixe Libellé Occupation":
            - columnheader "Préfixe"
            - columnheader "Libellé"
            - columnheader "Occupation"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs \d+ %/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.2\.0\/\d+ Supervision \d+ %/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Supervision"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Réserve \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Réserve"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Salle B \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Salle B"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Invités \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell /\d+ %/
          - row /\d+:db8::\/\d+ Sauvegardes 7 %/:
            - gridcell /\d+:db8::\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "7 %"
      - alert
      - complementary "Panneau droit":
        - separator "Redimensionner le panneau"
        - tablist "Onglets du panneau":
          - tab "Détail" [selected]
          - tab "Brouillon 3"
        - tabpanel "Détail":
          - paragraph: /\d+\.\d+\.\d+\.\d+\/\d+/
          - paragraph: Supervision · Production
          - paragraph: "/Occupation : \\d+ %/"
          - grid "Adresses":
            - rowgroup:
              - row "Adresse Usage":
                - columnheader "Adresse"
                - columnheader "Usage"
            - rowgroup:
              - row /\d+\.\d+\.\d+\.\d+ Statique/:
                - gridcell /\d+\.\d+\.\d+\.\d+/
                - gridcell "Statique"
              - row /\d+\.\d+\.\d+\.\d+ DHCP/:
                - gridcell /\d+\.\d+\.\d+\.\d+/
                - gridcell "DHCP"
          - alert
        - button "Largeur du panneau"
        - button "Fermer le panneau"
      - code: cell-choice
      - text: ""