- main:
  - region "TreeGrid":
    - heading "TreeGrid" [level=1]
    - paragraph: "Motif : Treegrid"
    - 'figure "editing — Édition en place : éditeur ouvert, cellule en attente, en revue, en erreur (motif et code)"':
      - treegrid "Arbre des préfixes":
        - rowgroup:
          - row "Préfixe Environnement Occupation":
            - columnheader "Préfixe"
            - columnheader "Environnement"
            - columnheader "Occupation"
        - rowgroup:
          - row "Centre de données nord" [expanded] [level=1]:
            - gridcell "Centre de données nord"
            - gridcell
            - gridcell
          - row /Serveurs \d+\.\d+\.2\.0\/\d+ Production \d+ % \(en revue\)/ [expanded] [level=2]:
            - gridcell /Serveurs \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Production"
            - gridcell /\d+ % \(en revue\)/
          - row /Bases \d+\.\d+\.2\.0\/\d+ Production \(en attente\) \d+ %/ [level=3]:
            - gridcell /Bases \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Production (en attente)"
            - gridcell /\d+ %/
          - row /Supervision \d+\.\d+\.\d+\.\d+\/\d+ Recette \d+ %/ [level=3]:
            - gridcell /Supervision \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Recette":
              - textbox "Environnement — Supervision": Recette
            - gridcell /\d+ %/
          - row /Postes \d+\.\d+\.\d+\.\d+\/\d+ Production \d+ %/ [level=2]:
            - gridcell /Postes \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Invités \d+\.\d+\.\d+\.\d+\/\d+ Développement 3 %/ [level=2]:
            - gridcell /Invités \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Développement" [invalid]
            - gridcell "3 %"
      - status
      - alert
      - code: editing
      - text: ""