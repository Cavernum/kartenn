    - paragraph: /Normal \d+ Moyen \d+ Demi-gras \d+/
    - heading "Colonne de chiffres" [level=2]
    - 'table "Chiffres tabulaires : les colonnes s''alignent, en chasse fixe comme en sans."':
      - caption: "Chiffres tabulaires : les colonnes s'alignent, en chasse fixe comme en sans."
      - rowgroup:
        - row "Préfixe Adresses Occupation":
          - columnheader "Préfixe"
          - columnheader "Adresses"
          - columnheader "Occupation"
      - rowgroup:
        - row /\d+\.\d+\.0\.0\/8 \d+ \d+ \d+ \d+,\d+ %/:
          - cell /\d+\.\d+\.0\.0\/8/:
            - code: /\d+\.\d+\.0\.0\/8/
          - cell /\d+ \d+ \d+/
          - cell /\d+,\d+ %/
        - row /\d+\.\d+\.0\.0\/\d+ \d+ \d+ \d+,\d+ %/:
          - cell /\d+\.\d+\.0\.0\/\d+/:
            - code: /\d+\.\d+\.0\.0\/\d+/
          - cell /\d+ \d+/
          - cell /\d+,\d+ %/
        - row /\d+\.\d+\.\d+\.\d+\/\d+ 4 \d+ \d+,\d+ %/:
          - cell /\d+\.\d+\.\d+\.\d+\/\d+/:
            - code: /\d+\.\d+\.\d+\.\d+\/\d+/
          - cell /4 \d+/
          - cell /\d+,\d+ %/
        - row /\d+\.\d+\.2\.0\/\d+ \d+ \d+,\d+ %/:
          - cell /\d+\.\d+\.2\.0\/\d+/:
            - code: /\d+\.\d+\.2\.0\/\d+/
          - cell /\d+/
          - cell /\d+,\d+ %/
        - row /\d+:db8::\/\d+ 2\^\d+ \d+,\d+ %/:
          - cell /\d+:db8::\/\d+/:
            - code: /\d+:db8::\/\d+/
          - cell /2\^\d+/
          - cell /\d+,\d+ %/
