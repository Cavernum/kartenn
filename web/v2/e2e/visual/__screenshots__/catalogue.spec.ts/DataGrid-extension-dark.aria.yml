- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: "Motif : Grid (maison) ; une seule grille, lignes en subgrid ; tri et filtre de colonne"
    - 'figure "extension — Colonne d''une extension : un élément personnalisé par ligne, recréé quand la ligne revient"':
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Préfixe Libellé Environnement Occupation Responsable Supervision (extension)":
            - columnheader "Préfixe":
              - text: ""
              - 'button "Filtrer : Préfixe"'
            - columnheader "Libellé"
            - columnheader "Environnement":
              - text: ""
              - 'button "Filtrer : Environnement"'
            - columnheader "Occupation"
            - columnheader "Responsable"
            - columnheader "Supervision (extension)"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs de bases Production \d+ % Équipe réseau Non sondé/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs de bases"
            - gridcell "Production"
            - gridcell /\d+ %/
            - gridcell "Équipe réseau"
            - gridcell "Non sondé"
          - row /\d+\.\d+\.2\.0\/\d+ Postes du siège Recette \d+ % Équipe postes Sondé/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Postes du siège"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
            - gridcell "Sondé":
              - link "Sondé":
                - /url: "#sonde"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Supervision Développement \d+ % Exploitation Non sondé/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Supervision"
            - gridcell "Développement"
            - gridcell /\d+ %/
            - gridcell "Exploitation"
            - gridcell "Non sondé"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Sauvegardes Production 3 % Équipe réseau Non sondé/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "Production"
            - gridcell "3 %"
            - gridcell "Équipe réseau"
            - gridcell "Non sondé"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Invités Recette \d+ % Équipe postes Sondé/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
            - gridcell "Sondé":
              - link "Sondé":
                - /url: "#sonde"
      - alert
      - code: extension
      - text: ""