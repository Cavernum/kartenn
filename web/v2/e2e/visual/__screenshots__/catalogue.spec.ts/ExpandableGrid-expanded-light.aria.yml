- main:
  - dialog "Flux non conformes":
    - heading "Flux non conformes" [level=2]
    - button "Fermer"
    - paragraph: /\d+ lignes/
    - grid "Flux non conformes":
      - rowgroup:
        - row "Source Destination Protocole Service Règle":
          - columnheader "Source"
          - columnheader "Destination"
          - columnheader "Protocole"
          - columnheader "Service"
          - columnheader "Règle"
      - rowgroup:
        - row /rece-batch prod-api TCP\/\d+ https Copier flow\.verdict\.default/:
          - gridcell "rece-batch"
          - gridcell "prod-api"
          - gridcell /TCP\/\d+/
          - gridcell "https"
          - gridcell "Copier flow.verdict.default":
            - button "Copier flow.verdict.default":
              - text: ""
              - code: flow.verdict.default
            - status
