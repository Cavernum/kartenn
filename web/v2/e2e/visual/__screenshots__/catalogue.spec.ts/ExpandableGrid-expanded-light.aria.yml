- main:
  - dialog "Flux cassés":
    - heading "Flux cassés" [level=2]
    - button "Fermer"
    - paragraph: /\d+ lignes/
    - grid "Flux cassés":
      - rowgroup:
        - row "Source Destination Service Règle":
          - columnheader "Source"
          - columnheader "Destination"
          - columnheader "Service"
          - columnheader "Règle"
      - rowgroup:
        - row /rece-batch prod-api tcp\/\d+ Copier flow\.verdict\.default/:
          - gridcell "rece-batch"
          - gridcell "prod-api"
          - gridcell /tcp\/\d+/
          - gridcell "Copier flow.verdict.default":
            - button "Copier flow.verdict.default":
              - text: ""
              - code: flow.verdict.default
            - status
