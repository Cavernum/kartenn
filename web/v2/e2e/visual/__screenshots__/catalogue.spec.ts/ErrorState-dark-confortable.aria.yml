- main:
  - region "ErrorState":
    - heading "ErrorState" [level=1]
    - paragraph: "Motif : role=alert, codes copiables"
    - figure "retry — Phrase, code, identifiant de requête, Réessayer":
      - alert:
        - paragraph: Le service ne répond pas.
      - button "Copier type urn:kartenn:problem:unavailable":
        - text: ""
        - code: urn:kartenn:problem:unavailable
      - status
      - button "Copier Request-Id req_7f3a9c2e5b1d4068":
        - text: ""
        - code: req_7f3a9c2e5b1d4068
      - status
      - button "Réessayer"
      - code: retry
      - text: ""
    - 'figure /precondition — Erreur \d+ : message, code et identifiant de requête copiables \(REQ-\d+-\d+\)/':
      - alert:
        - paragraph: "Ce préfixe a changé depuis votre lecture : relisez-le avant de le modifier."
      - button "Copier type urn:kartenn:problem:precondition-failed":
        - text: ""
        - code: urn:kartenn:problem:precondition-failed
      - status
      - button "Copier Request-Id req_7f3a9c2e5b1d4068":
        - text: ""
        - code: req_7f3a9c2e5b1d4068
      - status
      - button "Relire"
      - code: precondition
      - text: ""
    - 'figure "violations — Violations : chaque gravité, message et code (un avertissement le dit)"':
      - alert:
        - paragraph: Le changeset est refusé.
      - list:
        - listitem:
          - text: Erreur Le préfixe chevauche un voisin.
          - button "Copier prefix.overlaps-sibling":
            - text: ""
            - code: prefix.overlaps-sibling
          - status
        - listitem:
          - text: Erreur Le responsable est inconnu.
          - button "Copier core.owner.unknown":
            - text: ""
            - code: core.owner.unknown
          - status
        - listitem:
          - text: Avertissement Le TTL DNS est attendu en production.
          - button "Copier prop.dns.ttl-missing":
            - text: ""
            - code: prop.dns.ttl-missing
          - status
      - button "Copier type urn:kartenn:problem:changeset-refused":
        - text: ""
        - code: urn:kartenn:problem:changeset-refused
      - status
      - button "Copier Request-Id req_7f3a9c2e5b1d4068":
        - text: ""
        - code: req_7f3a9c2e5b1d4068
      - status
      - code: violations
      - text: ""
    - figure "forbidden — Sans nouvelle tentative possible":
      - alert:
        - paragraph: Vous n'avez pas le droit de lire ce domaine.
      - button "Copier type urn:kartenn:problem:forbidden":
        - text: ""
        - code: urn:kartenn:problem:forbidden
      - status
      - button "Copier Request-Id req_7f3a9c2e5b1d4068":
        - text: ""
        - code: req_7f3a9c2e5b1d4068
      - status
      - code: forbidden
      - text: ""
    - 'figure "network — Sans réponse de l''API : la phrase et Réessayer, aucun code inventé"':
      - alert:
        - paragraph: Le serveur est injoignable.
      - button "Réessayer"
      - code: network
      - text: ""