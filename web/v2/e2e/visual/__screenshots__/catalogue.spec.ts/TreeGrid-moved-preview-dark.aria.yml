- main:
  - region "TreeGrid":
    - heading "TreeGrid" [level=1]
    - paragraph: "Motif : Treegrid"
    - 'figure "moved-preview — Nœud que le brouillon déplace : sa ligne au présent (déplacé dans le brouillon) et sa ligne d''aperçu à la place d''après"':
      - treegrid "Arbre des préfixes":
        - rowgroup:
          - row "Préfixe Environnement Occupation":
            - columnheader "Préfixe"
            - columnheader "Environnement"
            - columnheader "Occupation"
        - rowgroup:
          - row "Centre de données nord" [expanded] [level=1]:
            - gridcell "Centre de données nord"
            - gridcell
            - gridcell
          - row /Serveurs \d+\.\d+\.2\.0\/\d+ Production \d+ %/ [expanded] [level=2]:
            - gridcell /Serveurs \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Bases \d+\.\d+\.2\.0\/\d+ Production \d+ %/ [level=3]:
            - gridcell /Bases \d+\.\d+\.2\.0\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Supervision \d+\.\d+\.\d+\.\d+\/\d+ \(déplacé dans le brouillon\) Recette \d+ %/ [level=3]:
            - gridcell /Supervision \d+\.\d+\.\d+\.\d+\/\d+ \(déplacé dans le brouillon\)/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
              - text: ""
            - gridcell "Recette"
            - gridcell /\d+ %/
          - row /Postes \d+\.\d+\.\d+\.\d+\/\d+ Production \d+ %/ [level=2]:
            - gridcell /Postes \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Production"
            - gridcell /\d+ %/
          - row /Invités \d+\.\d+\.\d+\.\d+\/\d+ Développement 3 %/ [expanded] [level=2]:
            - gridcell /Invités \d+\.\d+\.\d+\.\d+\/\d+/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Développement"
            - gridcell "3 %"
          - row /Supervision \d+\.\d+\.\d+\.\d+\/\d+ \(aperçu du brouillon\) Recette \d+ %/ [level=3]:
            - gridcell /Supervision \d+\.\d+\.\d+\.\d+\/\d+ \(aperçu du brouillon\)/:
              - text: ""
              - code: /\d+\.\d+\.\d+\.\d+\/\d+/
              - text: ""
            - gridcell "Recette"
            - gridcell /\d+ %/
      - status
      - alert
      - code: moved-preview
      - text: ""