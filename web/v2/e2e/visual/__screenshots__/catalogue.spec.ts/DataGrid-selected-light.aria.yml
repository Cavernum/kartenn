- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: "Motif : Grid (maison) ; une seule grille, lignes en subgrid ; tri et filtre de colonne"
    - figure "selected — Lignes sélectionnées (aria-selected), multisélection":
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Sélectionner toutes les lignes Préfixe Libellé Environnement Occupation Responsable":
            - columnheader "Sélectionner toutes les lignes":
              - checkbox "Sélectionner toutes les lignes" [checked=mixed]
              - text: ""
            - columnheader "Préfixe":
              - text: ""
              - 'button "Filtrer : Préfixe"'
            - columnheader "Libellé"
            - columnheader "Environnement":
              - text: ""
              - 'button "Filtrer : Environnement"'
            - columnheader "Occupation"
            - columnheader "Responsable"
        - rowgroup:
          - row /Sélectionner \d+\.\d+\.2\.0\/\d+ \d+\.\d+\.2\.0\/\d+ Serveurs de bases Production \d+ % Équipe réseau/:
            - gridcell /Sélectionner \d+\.\d+\.2\.0\/\d+/:
              - checkbox /Sélectionner \d+\.\d+\.2\.0\/\d+/
              - text: ""
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs de bases"
            - gridcell "Production"
            - gridcell /\d+ %/
            - gridcell "Équipe réseau"
          - row /Sélectionner \d+\.\d+\.2\.0\/\d+ \d+\.\d+\.2\.0\/\d+ Postes du siège Recette \d+ % Équipe postes/ [selected]:
            - gridcell /Sélectionner \d+\.\d+\.2\.0\/\d+/:
              - checkbox /Sélectionner \d+\.\d+\.2\.0\/\d+/ [checked]
              - text: ""
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Postes du siège"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
          - row /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+ \d+\.\d+\.\d+\.\d+\/\d+ Supervision Développement \d+ % Exploitation/ [selected]:
            - gridcell /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/:
              - checkbox /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/ [checked]
              - text: ""
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Supervision"
            - gridcell "Développement"
            - gridcell /\d+ %/
            - gridcell "Exploitation"
          - row /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+ \d+\.\d+\.\d+\.\d+\/\d+ Sauvegardes Production 3 % Équipe réseau/:
            - gridcell /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/:
              - checkbox /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/
              - text: ""
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "Production"
            - gridcell "3 %"
            - gridcell "Équipe réseau"
          - row /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+ \d+\.\d+\.\d+\.\d+\/\d+ Invités Recette \d+ % Équipe postes/:
            - gridcell /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/:
              - checkbox /Sélectionner \d+\.\d+\.\d+\.\d+\/\d+/
              - text: ""
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
      - alert
      - code: selected
      - text: ""