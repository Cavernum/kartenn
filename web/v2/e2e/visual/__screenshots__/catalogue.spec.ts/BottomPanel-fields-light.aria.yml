- main:
  - region "BottomPanel":
    - heading "BottomPanel" [level=1]
    - paragraph: "Motif : région complementary (non modale) + Tabs ; poignée Window Splitter horizontale ; en feuille, Dialog (Modal)"
    - 'figure "fields — Un champ texte dans l''onglet Détail, suivi par l''hôte (`modified`) : intact, Échap ferme le panneau depuis le champ ; modifié, Échap ou la croix demandent d''abord « Abandonner les modifications ? »"':
      - heading /Contenu de \d+\.\d+\.2\.0\/\d+/ [level=2]
      - grid "Préfixes":
        - rowgroup:
          - row "Préfixe Libellé Occupation":
            - columnheader "Préfixe"
            - columnheader "Libellé"
            - columnheader "Occupation"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs \d+ %/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.2\.0\/\d+ Supervision \d+ %/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Supervision"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Réserve \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Réserve"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Salle B \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Salle B"
            - gridcell /\d+ %/
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Invités \d+ %/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell /\d+ %/
          - row /\d+:db8::\/\d+ Sauvegardes 7 %/:
            - gridcell /\d+:db8::\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "7 %"
      - alert
      - button /Détail de \d+\.\d+\.\d+\.\d+\/\d+/
      - complementary "Panneau du bas":
        - separator "Redimensionner le panneau"
        - tablist "Onglets du panneau":
          - tab "Détail" [selected]
          - tab "Historique 3"
        - tabpanel "Détail":
          - text: Libellé
          - textbox "Libellé": Supervision
        - button "Hauteur du panneau"
        - button "Fermer le panneau"
      - code: fields
      - text: "— Un champ texte dans l'onglet Détail, suivi par l'hôte (`modified`) : intact, Échap ferme le panneau depuis le champ ; modifié, Échap ou la croix demandent d'abord « Abandonner les modifications ? »"