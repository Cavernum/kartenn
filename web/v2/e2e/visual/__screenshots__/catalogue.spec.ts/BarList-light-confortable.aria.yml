- main:
  - region "BarList":
    - heading "BarList" [level=1]
    - paragraph: "Motif : table (en-têtes de ligne, valeurs), barres décoratives"
    - figure /percent — Occupation de groupes, échelle à \d+ %/:
      - table "Occupation des groupes de VLAN":
        - caption: Occupation des groupes de VLAN
        - rowgroup:
          - row "Groupe Occupation":
            - columnheader "Groupe"
            - columnheader "Occupation"
        - rowgroup:
          - row /campus-ouest \d+ %/:
            - rowheader "campus-ouest"
            - cell /\d+ %/
          - row /campus-est \d+ %/:
            - rowheader "campus-est"
            - cell /\d+ %/
          - row "labo 6 %":
            - rowheader "labo"
            - cell "6 %"
      - code: percent
      - text: ""
    - figure "counts — Comptes, échelle sur la plus grande valeur":
      - table "Objets par sorte":
        - caption: Objets par sorte
        - rowgroup:
          - row "Point Valeur":
            - columnheader "Point"
            - columnheader "Valeur"
        - rowgroup:
          - row /Préfixes 1 \d+/:
            - rowheader "Préfixes"
            - cell /1 \d+/
          - row /Plages \d+/:
            - rowheader "Plages"
            - cell /\d+/
          - row /Entités \d+/:
            - rowheader "Entités"
            - cell /\d+/
      - code: counts
      - text: ""
    - 'figure "over — Une valeur au-delà de l''échelle : barre pleine, coupée à sa fin"':
      - table "Occupation des groupes de VLAN":
        - caption: Occupation des groupes de VLAN
        - rowgroup:
          - row "Point Valeur":
            - columnheader "Point"
            - columnheader "Valeur"
        - rowgroup:
          - row /dmz \d+ %/:
            - rowheader "dmz"
            - cell /\d+ %/
          - row /campus-est \d+ %/:
            - rowheader "campus-est"
            - cell /\d+ %/
          - row "labo 6 %":
            - rowheader "labo"
            - cell "6 %"
      - code: over
      - text: ""