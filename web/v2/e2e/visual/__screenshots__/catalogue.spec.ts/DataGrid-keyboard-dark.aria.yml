- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: "Motif : Grid (maison) ; une seule grille, lignes en subgrid ; tri et filtre de colonne"
    - 'figure "keyboard — Script du clavier : sélection multiple, colonnes redimensionnables, libellé et responsable modifiables (Entrée ou F2)"':
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Sélectionner toutes les lignes Préfixe Libellé Environnement Occupation Responsable":
            - columnheader "Sélectionner toutes les lignes":
              - checkbox "Sélectionner toutes les lignes"
              - text: ""
            - columnheader "Préfixe":
              - text: ""
              - 'button "Filtrer : Préfixe"'
              - separator "Redimensionner la colonne Préfixe"
            - columnheader "Libellé":
              - text: ""
              - separator "Redimensionner la colonne Libellé"
            - columnheader "Environnement":
              - text: ""
              - 'button "Filtrer : Environnement"'
              - separator "Redimensionner la colonne Environnement"
            - columnheader "Occupation":
              - text: ""
              - separator "Redimensionner la colonne Occupation"
            - columnheader "Responsable":
              - text: ""
              - separator "Redimensionner la colonne Responsable"
