- main:
  - region "ExpandableGrid":
    - heading "ExpandableGrid" [level=1]
    - paragraph: "Motif : Grid compacte + Button qui ouvre un Dialog (Modal) avec la même grille"
    - 'figure "few — Trois lignes : la grille garde sa hauteur naturelle"':
      - text: 3 lignes
      - 'button "Agrandir : Flux non conformes"'
      - grid "Flux non conformes":
        - rowgroup:
          - row "Source Destination Type de flux":
            - columnheader "Source"
            - columnheader "Destination"
            - columnheader "Type de flux"
        - rowgroup:
          - row "rece-batch prod-api Applicatif":
            - gridcell "rece-batch"
            - gridcell "prod-api"
            - gridcell "Applicatif"
          - row "rece-ci prod-api Applicatif":
            - gridcell "rece-ci"
            - gridcell "prod-api"
            - gridcell "Applicatif"
          - row "rece-web prod-api Applicatif":
            - gridcell "rece-web"
            - gridcell "prod-api"
            - gridcell "Applicatif"
      - code: few
      - text: ""