- main:
  - region "DataGrid":
    - heading "DataGrid" [level=1]
    - paragraph: "Motif : Grid (maison) ; une seule grille, lignes en subgrid ; tri et filtre de colonne"
    - figure "row-states — Lignes en brouillon, en revue, retirée dans le brouillon (barrée) ; une ligne qui entre dans un brouillon s'éclaire puis s'estompe":
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Préfixe Libellé Environnement Occupation Responsable":
            - columnheader "Préfixe"
            - columnheader "Libellé"
            - columnheader "Environnement"
            - columnheader "Occupation"
            - columnheader "Responsable"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs de bases Production \d+ % Équipe réseau/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs de bases"
            - gridcell "Production"
            - gridcell /\d+ %/
            - gridcell "Équipe réseau"
          - row /\(en brouillon\) \d+\.\d+\.2\.0\/\d+ Postes du siège Recette \d+ % Équipe postes/:
            - gridcell /\(en brouillon\) \d+\.\d+\.2\.0\/\d+/
            - gridcell "Postes du siège"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Supervision Développement \d+ % Exploitation/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Supervision"
            - gridcell "Développement"
            - gridcell /\d+ %/
            - gridcell "Exploitation"
          - row /\(en revue\) \d+\.\d+\.\d+\.\d+\/\d+ Sauvegardes Production 3 % Équipe réseau/:
            - gridcell /\(en revue\) \d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "Production"
            - gridcell "3 %"
            - gridcell "Équipe réseau"
          - row /\(retirée dans le brouillon\) \d+\.\d+\.\d+\.\d+\/\d+ Invités Recette \d+ % Équipe postes/:
            - gridcell /\(retirée dans le brouillon\) \d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell "Recette"
            - gridcell /\d+ %/
            - gridcell "Équipe postes"
      - code: row-states
      - text: ""