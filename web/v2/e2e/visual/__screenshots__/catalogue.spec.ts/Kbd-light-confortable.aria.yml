- main:
  - region "Kbd":
    - heading "Kbd" [level=1]
    - paragraph: "Motif : — (kbd imbriqués d'une combinaison)"
    - figure "palette — Palette de commandes":
      - text: Ctrl K
      - code: palette
      - text: ""
    - figure "single — Une touche (filtre de la vue)":
      - text: /
      - code: single
      - text: ""
    - figure "named — Touches nommées":
      - text: Ctrl Entrée
      - code: named
      - text: ""
    - figure "shift — Maj+Espace (étendre la sélection de lignes)":
      - text: Maj Espace
      - code: shift
      - text: ""
    - figure "arrows — Flèches":
      - text: Alt ↓
      - code: arrows
      - text: ""
    - figure "escape — Échap":
      - text: ""
      - code: escape
      - text: ""