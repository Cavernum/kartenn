- main:
  - region "DateTimeField":
    - heading "DateTimeField" [level=1]
    - paragraph: "/Motif : Spinbutton par segment \\(ISO \\d+\\) et Date Picker Dialog/"
    - 'figure "empty — Vide : les segments en attente, le fuseau nommé et son décalage"':
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: "Vide : maintenant."
      - code: empty
      - text: ""
    - 'figure /filled — Un instant \(UTC\) lu dans le fuseau de Paris : \d+:\d+ à UTC\+\d+:\d+/':
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
      - code: filled
      - text: ""
    - 'figure /summer — Le même fuseau en été : décalage UTC\+\d+:\d+/':
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
      - code: summer
      - text: ""
    - 'figure "day — Un jour seul (AAAA-MM-JJ) : ni heure ni fuseau"':
      - group "Créé le":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - 'button "Choisir la date : Créé le"'
      - code: day
      - text: ""
    - 'figure "small — Taille sm (éditeur de cellule, barre) : le bouton tient dans le cadre"':
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
      - code: small
      - text: ""
    - 'figure /invalid — \d+ février : gardé tel que saisi, refusé, le motif lié et le segment marqué/':
      - group "Valide au":
        - text: ""
        - spinbutton "Année" [invalid]
        - spinbutton "Mois" [invalid]
        - spinbutton "Jour" [invalid]
        - spinbutton "Heure" [invalid]
        - spinbutton "Minutes" [invalid]
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: "/Le \\d+ février \\d+ n'existe pas : février \\d+ a \\d+ jours\\./"
      - code: invalid
      - text: ""
    - 'figure /hour — \d+ h : refusée, les bornes de l''heure dites/':
      - group "Valide au":
        - text: ""
        - spinbutton "Année" [invalid]
        - spinbutton "Mois" [invalid]
        - spinbutton "Jour" [invalid]
        - spinbutton "Heure" [invalid]
        - spinbutton "Minutes" [invalid]
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: /L'heure va de \d+ à \d+\./
      - code: hour
      - text: ""
    - figure /gap — L'heure sautée au passage à l'heure d'été \(Paris, \d+ mars \d+, \d+:\d+\)/:
      - group "Valide au":
        - text: ""
        - spinbutton "Année" [invalid]
        - spinbutton "Mois" [invalid]
        - spinbutton "Jour" [invalid]
        - spinbutton "Heure" [invalid]
        - spinbutton "Minutes" [invalid]
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: "/\\d+:\\d+ n'existe pas le \\d+ mars \\d+ en Europe\\/Paris : l'heure avance ce jour-là\\./"
      - code: gap
      - text: ""
    - 'figure "incomplete — Incomplète au départ du champ : ce qui manque dit"':
      - group "Valide au":
        - text: ""
        - spinbutton "Année" [invalid]
        - spinbutton "Mois" [invalid]
        - spinbutton "Jour" [invalid]
        - spinbutton "Heure" [invalid]
        - spinbutton "Minutes" [invalid]
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: "Date incomplète : il manque l'heure."
      - code: incomplete
      - text: ""
    - 'figure "readonly — Lecture seule : bordure en tirets, sans calendrier"':
      - group "Connu au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
      - code: readonly
      - text: ""
    - 'figure "disabled — Désactivé : hors de l''ordre de tabulation"':
      - group "Valide au":
        - text: ""
        - spinbutton "Année" [disabled]
        - spinbutton "Mois" [disabled]
        - spinbutton "Jour" [disabled]
        - spinbutton "Heure" [disabled]
        - spinbutton "Minutes" [disabled]
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au" [disabled]'
      - code: disabled
      - text: ""
    - 'figure "focus — Focus clavier sur un segment : rempli de l''accent, le cadre entouré"':
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
      - code: focus
      - text: ""
    - 'figure "calendar — Calendrier ouvert (dialogue modal) : le jour choisi, aujourd''hui entouré"':
      - link "Voir l'état calendar seul":
        - /url: /_ui/c/DateTimeField?mode=dark&densite=confortable&etat=calendar
      - code: calendar
      - text: ""
    - 'figure "keyboard — Au clavier : saisie par segments, calendrier, refus ; la valeur écrite"':
      - text: Note
      - textbox "Note"
      - group "Valide au":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - spinbutton "Heure"
        - spinbutton "Minutes"
        - text: /Europe\/Paris UTC\+\d+:\d+/
        - 'button "Choisir la date : Valide au"'
        - paragraph: Date et heure de Paris.
      - paragraph:
        - text: "Valide au :"
        - code: —
      - group "Créé le":
        - text: ""
        - spinbutton "Année"
        - spinbutton "Mois"
        - spinbutton "Jour"
        - 'button "Choisir la date : Créé le"'
      - paragraph:
        - text: "Créé le :"
        - code: —
      - code: keyboard
      - text: ""