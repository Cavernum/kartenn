- main:
  - region "PeriodPicker":
    - heading "PeriodPicker" [level=1]
    - paragraph: "Motif : Formulaire de deux DateTimeField (valid_at, as_of) et raccourcis"
    - 'figure "present — Au présent : les deux dates vides, le fuseau nommé"':
      - form "Lire à une date":
        - heading "Lire à une date" [level=2]
        - group "Valide au":
          - text: ""
          - spinbutton "Année"
          - spinbutton "Mois"
          - spinbutton "Jour"
          - spinbutton "Heure"
          - spinbutton "Minutes"
          - text: /Europe\/Paris UTC\+\d+:\d+/
          - 'button "Choisir la date : Valide au"'
          - paragraph: "Ce qui est vrai à cette date, passée ou à venir ; vide : maintenant."
        - 'group "Raccourcis : Valide au"':
          - button "Maintenant"
          - button "Hier"
          - button "Début du mois"
        - group "Connu au":
          - text: ""
          - spinbutton "Année"
          - spinbutton "Mois"
          - spinbutton "Jour"
          - spinbutton "Heure"
          - spinbutton "Minutes"
          - text: /Europe\/Paris UTC\+\d+:\d+/
          - 'button "Choisir la date : Connu au"'
          - paragraph: "Ce que la base savait à cette date ; vide : ce qu'elle sait."
        - 'group "Raccourcis : Connu au"':
          - button "Maintenant"
          - button "Hier"
          - button "Début du mois"
        - status
        - button "Appliquer"
      - code: present
      - text: ""