- main:
  - region "Panel":
    - heading "Panel" [level=1]
    - paragraph: "Motif : section (titre h2 ; région nommée pour le panneau principal seul)"
    - figure "rest — Panneau titré, son détail après le titre, son action au bout de l'en-tête":
      - heading "Préfixes" [level=2]
      - text: "5"
      - button "Nouveau préfixe"
      - paragraph: Les préfixes du domaine, avec leur environnement et leur occupation.
      - code: rest
      - text: ""
    - 'figure "main — Panneau principal : titre plus grand, région nommée par lui ; détail en chasse fixe"':
      - region "Préfixe":
        - heading "Préfixe" [level=2]
        - text: /\d+\.\d+\.2\.0\/\d+/
        - button "Nouveau préfixe"
        - paragraph: Les préfixes du domaine, avec leur environnement et leur occupation.
      - code: main
      - text: ""
    - 'figure "toolbar — Barre d''actions dans l''en-tête : elle prend le reste de la ligne"':
      - heading "Préfixes" [level=2]
      - text: "5"
      - toolbar "Actions sur les préfixes":
        - button "Créer"
        - button "Importer"
        - button "Exporter"
      - paragraph: Les préfixes du domaine, avec leur environnement et leur occupation.
      - code: toolbar
      - text: ""
    - 'figure "toolbar-folded — Panneau plus étroit que ses actions : le titre reste entier, la barre replie dans « … »"':
      - heading "Préfixes" [level=2]
      - text: "5"
      - toolbar "Actions sur les préfixes":
        - button "Créer"
        - button "Plus d'actions"
      - paragraph: Les préfixes du domaine, avec leur environnement et leur occupation.
      - code: toolbar-folded
      - text: ""
    - figure "parts — Barre sous l'en-tête, corps sans marge (une grille), pied":
      - heading "Préfixes" [level=2]
      - text: 5 Rechercher
      - searchbox "Rechercher"
      - grid "Préfixes du domaine":
        - rowgroup:
          - row "Préfixe Libellé Environnement":
            - columnheader "Préfixe"
            - columnheader "Libellé"
            - columnheader "Environnement"
        - rowgroup:
          - row /\d+\.\d+\.2\.0\/\d+ Serveurs de bases Production/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Serveurs de bases"
            - gridcell "Production"
          - row /\d+\.\d+\.2\.0\/\d+ Postes du siège Recette/:
            - gridcell /\d+\.\d+\.2\.0\/\d+/
            - gridcell "Postes du siège"
            - gridcell "Recette"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Supervision Développement/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Supervision"
            - gridcell "Développement"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Sauvegardes Production/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Sauvegardes"
            - gridcell "Production"
          - row /\d+\.\d+\.\d+\.\d+\/\d+ Invités Recette/:
            - gridcell /\d+\.\d+\.\d+\.\d+\/\d+/
            - gridcell "Invités"
            - gridcell "Recette"
      - alert
      - text: 5 préfixes
      - button "Exporter"
      - code: parts
      - text: ""
    - 'figure "long — Titre plus long que la tuile : il va à la ligne, l''action sur une ligne à elle"':
      - heading /srv-\d+-db8-0-1-supervision-collecteur-principal-nord-\d+\.example\.net/ [level=2]
      - text: /\d+ interfaces/
      - button "Nouveau préfixe"
      - paragraph: Les préfixes du domaine, avec leur environnement et leur occupation.
      - code: long
      - text: ""
