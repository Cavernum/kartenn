    - combobox "Propriété": Usage
    - status
    - paragraph: "Clé : usage"
    - text: Opérateur
    - combobox "Opérateur": est
    - text: Valeur
    - combobox "Valeur"
    - status
    - list "Valeurs choisies":
      - listitem:
        - text: Hôte
        - button "Retirer Hôte"
      - listitem:
        - text: VIP
        - button "Retirer VIP"
    - status
    - button "Annuler"
    - button "Appliquer"
  - region "FilterPicker":
    - heading "FilterPicker" [level=1]
    - paragraph: "Motif : Button puis Combobox en séquence (propriété, opérateur, valeur) dans un popover"
    - 'figure "values — Modification : plusieurs valeurs choisies, chacune retirable"':
