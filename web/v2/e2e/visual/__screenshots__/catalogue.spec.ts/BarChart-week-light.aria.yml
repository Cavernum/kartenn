- main:
  - region "BarChart":
    - heading "BarChart" [level=1]
    - paragraph: "Motif : role img nommé par un résumé, table de données cachée"
    - 'figure "week — Sept jours : barres larges"':
      - figure:
        - 'img /Changesets appliqués par jour : 7 valeurs, 9 janv\. – \d+ janv\. ; maximum \d+ \(\d+ janv\.\) ; dernière 7/'
        - table "Changesets appliqués par jour":
          - caption: Changesets appliqués par jour
          - rowgroup:
            - row "Jour Appliqués":
              - columnheader "Jour"
              - columnheader "Appliqués"
          - rowgroup:
            - row "9 janv. 6":
              - rowheader "9 janv."
              - cell "6"
            - row /\d+ janv\. 0/:
              - rowheader /\d+ janv\./
              - cell "0"
            - row /\d+ janv\. 0/:
              - rowheader /\d+ janv\./
              - cell "0"
            - row /\d+ janv\. 8/:
              - rowheader /\d+ janv\./
              - cell "8"
            - row /\d+ janv\. 6/:
              - rowheader /\d+ janv\./
              - cell "6"
            - row /\d+ janv\. \d+/:
              - rowheader /\d+ janv\./
              - cell /\d+/
            - row /\d+ janv\. 7/:
              - rowheader /\d+ janv\./
              - cell "7"
      - code: week
      - text: ""