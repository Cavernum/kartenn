      - button "Centre de données nord"
      - status
      - code: hover
      - text: ""
    - 'figure "focus — Focus visible : la bulle aussitôt"':
      - button "Centre de données nord"
      - status
      - code: focus
      - text: ""
    - figure "plain — Texte seul (dans un contrôle, ou clé donnée ailleurs)":
      - text: Centre de données nord
