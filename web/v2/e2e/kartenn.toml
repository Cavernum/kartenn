# kartenn-server of the journeys of the new shell (spec 021, REQ-021-31; task 25): the one
# of web/e2e/kartenn.toml, but `[web]` on the builds of web/v2 — never in production, where
# `[web] root` serves the old shell until the cutover. The material (certificate, key ring,
# issuer) is the one web/e2e/serve.sh writes under web/e2e/.state, until the journeys are
# ported. Started by web/v2/e2e/serve.sh; paths are relative to the repository.
[telemetry]
outputs = [{ kind = "stdout", filter = "warn" }]

[http]
listen = "127.0.0.1:9443"
public_origin = "https://127.0.0.1:9443"

[http.tls]
cert_file = "web/e2e/.state/cert.pem"
key_file = "web/e2e/.state/key.pem"

# The quota of reads by identity (REQ-006-29) out of the journeys' way (task 021-11p9): the
# two workers of Playwright read as the same users, Alice above all, and share her quota
# (50 a second, 200 at once by default), which a list scrolled to its end page after page
# spends alone in a few seconds (one read of properties per row shown). A journey beside it
# then met 429 on its first read and showed « Trop de requêtes » instead of its rows. No
# journey is about the read quota (kartenn-rest tests/it/quota.rs is); the writes keep
# theirs, which the journeys of moves wait out (`Retry-After`). `serve.sh budgets` serves
# this file too: a bench of the browser that met the read quota measured its refusals.
[http.rate]
read = { per_second = 1000, burst = 4000 }

[web]
# `vite build` of web/v2/shell (production mode, without the catalogue).
root = "web/v2/dist/shell"
# The builds of web/v2/plugins/* (web/v2/dist/plugins/<name>/<version>/) and the test
# plugins of web/v2/e2e/plugins, gathered by serve.sh (task 16).
plugins_dir = "web/e2e/.state/plugins-v2"

[auth]
key_file = "web/e2e/.state/kartenn-keys"
redirect_uri = "https://127.0.0.1:9443/v1/auth/callback"

[[auth.issuers]]
id = "dev"
issuer = "https://127.0.0.1:9444"
client_id = "kartenn"
client_secret_file = "web/e2e/.state/idp-secret"
audience = "kartenn"
algorithms = ["ES256"]
native_client_id = "kartenn-cli"
native_scopes = ["openid", "offline_access"]
native_device = true
