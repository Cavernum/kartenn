# Development OIDC issuer of the end-to-end journeys (spec 007, REQ-007-34, 35), started
# by web/e2e/serve.sh; its material is written under web/e2e/.state by
# `kartenn-dev-idp certs`. Paths are relative to the repository.
issuer = "https://127.0.0.1:9444"
listen = "127.0.0.1:9444"
client_id = "kartenn"
client_secret_file = "web/e2e/.state/idp-secret"
redirect_uris = ["https://127.0.0.1:9443/v1/auth/callback"]
cert_file = "web/e2e/.state/cert.pem"
key_file = "web/e2e/.state/key.pem"

# The public client of the CLI (spec 023, T10), for its end-to-end journeys: a short
# interval, and one slow_down per device code to exercise the client (RFC 8628 §3.5).
[native]
client_id = "kartenn-cli"
audience = "kartenn"
device = true
device_interval = 1
slow_down = 1

[[users]]
sub = "alice"
name = "Alice Exemple"
email = "alice@kartenn.invalid"
groups = ["kartenn-admins"]

[[users]]
sub = "bob"
name = "Bob Exemple"
email = "bob@kartenn.invalid"
groups = ["lecteurs"]

# An editor confined to one entity (task 19): the interface shows her the forms, the
# server refuses a write elsewhere (403).
[[users]]
sub = "carol"
name = "Carol Exemple"
email = "carol@kartenn.invalid"
groups = ["redacteurs"]

[[users]]
sub = "refuse"
name = "Refus d'accès"
error = "access_denied"
